<script>
/* ========= Lean Terminal — Nest Mode (SGOV Locked) =========
   COMPLETE SCRIPT (with Executed checkbox indicator)

   Requires these element IDs in your HTML:
   statusLine, lastUpdated, nextRefresh
   valRegime, valDeploy, valCash, valLiq, valVol, valViol, valBrake
   actionMain, actionReason, actionNext, actionMeta
   executedBtn, execIcon, lastExecBadge
   mathDD, mathPeak, mathVol, mathSharpe
   holdingsUrl, systemUrl, holdingsBody, totalValue
   saveBtn, refreshBtn, runScanBtn

   Notes:
   - Executes after DOMContentLoaded (no white screen)
   - Robust CSV parsing (quotes/commas)
   - System loads FIRST, then holdings (no regime race)
   - Executed button shows ⬜/✅ via #execIcon + .done class
*/

window.addEventListener("DOMContentLoaded", () => {

  // ---------- LocalStorage keys ----------
  const LS_HOLDINGS="lean_holdings_csv_url";
  const LS_SYSTEM="lean_system_csv_url";

  const LS_LAST_EXEC_TICKER="lean_last_exec_ticker";
  const LS_LAST_EXEC_TIER="lean_last_exec_tier";
  const LS_LAST_EXEC_TS="lean_last_exec_ts";

  const LS_HIST="lean_portfolio_hist_v1";

  // ---------- settings ----------
  const PHASE="DEPLOY";
  const RAMP_DEFAULT=75;
  const RAMP_MAX=100;
  const SGOV_DAILY=20;
  const NEST_MODE=true;

  // ---------- elements ----------
  const $ = (id) => document.getElementById(id);
  const statusLine = $("statusLine");
  const lastUpdated = $("lastUpdated");
  const nextRefresh = $("nextRefresh");

  const valRegime = $("valRegime");
  const valDeploy = $("valDeploy");
  const valCash = $("valCash");
  const valLiq = $("valLiq");
  const valVol = $("valVol");
  const valViol = $("valViol");
  const valBrake = $("valBrake");

  const actionMain = $("actionMain");
  const actionReason = $("actionReason");
  const actionNext = $("actionNext");
  const actionMeta = $("actionMeta");

  const executedBtn = $("executedBtn");
  const execIcon = $("execIcon");          // <-- required for checkbox indicator
  const lastExecBadge = $("lastExecBadge");

  const mathDD = $("mathDD");
  const mathPeak = $("mathPeak");
  const mathVol = $("mathVol");
  const mathSharpe = $("mathSharpe");

  const holdingsUrl = $("holdingsUrl");
  const systemUrl = $("systemUrl");
  const holdingsBody = $("holdingsBody");
  const totalValue = $("totalValue");

  const saveBtn = $("saveBtn");
  const refreshBtn = $("refreshBtn");
  const runScanBtn = $("runScanBtn");

  // runtime
  let holdingsData = [];
  let suggested = { tier: null, ticker: null, amount: null };
  let inFlight = false;

  // ---------- helpers ----------
  function setText(el, txt) { if (el) el.textContent = txt; }
  function stamp(label){
    const t = new Date().toLocaleTimeString();
    setText(lastUpdated, "LAST UPDATED: " + t);
    setText(statusLine, label + " @ " + t);
  }

  function money(n){
    return isFinite(n) ? n.toLocaleString(undefined,{style:"currency",currency:"USD"}) : "$—";
  }

  function coerceNumber(v){
    if (v === null || v === undefined) return NaN;
    const s = String(v).replace(/[$,%\s]/g, "").replace(/,/g, "").trim();
    if (!s) return NaN;
    return Number(s);
  }

  async function fetchText(url){
    const sep = url.includes("?") ? "&" : "?";
    const res = await fetch(url + sep + "t=" + Date.now(), { cache:"no-store" });
    if(!res.ok) throw new Error("Fetch failed: " + res.status + " (" + url + ")");
    const text = await res.text();
    if (text.trim().startsWith("<")) throw new Error("URL returned HTML not CSV. Ensure &output=csv");
    return text;
  }

  // Robust CSV parser (quotes + commas)
  function parseCSV(text){
    const rows = [];
    let row = [];
    let cur = "";
    let inQuotes = false;

    const t = text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");

    for (let i=0; i<t.length; i++){
      const c = t[i];
      const n = t[i+1];

      if (inQuotes){
        if (c === '"' && n === '"'){ cur += '"'; i++; continue; }
        if (c === '"'){ inQuotes = false; continue; }
        cur += c; continue;
      }

      if (c === '"'){ inQuotes = true; continue; }
      if (c === ","){ row.push(cur); cur = ""; continue; }
      if (c === "\n"){ row.push(cur); rows.push(row); row=[]; cur=""; continue; }
      cur += c;
    }
    if (cur.length || row.length){ row.push(cur); rows.push(row); }

    while (rows.length && rows[rows.length-1].every(x => (x??"").trim()==="")) rows.pop();
    return rows;
  }

  function safeUpper(s){ return (s||"").toString().trim().toUpperCase(); }
  function normalizeTier(t){
    const x=safeUpper(t);
    if(x.startsWith("H")) return "HIGH";
    if(x.startsWith("M")) return "MED";
    if(x.startsWith("L")) return "LOW";
    return "";
  }

  function nextTierFromLast(last){
    const L=normalizeTier(last);
    if(L==="HIGH") return "LOW";
    if(L==="LOW")  return "MED";
    if(L==="MED")  return "LOW";
    return "LOW";
  }

  function pickNextTickerForTier(tier){
    const t=normalizeTier(tier);
    const candidates=holdingsData.filter(h=>normalizeTier(h.RiskTier)===t && safeUpper(h.Ticker)!=="SGOV");
    if(candidates.length===0) return null;

    const lastExec=(localStorage.getItem(LS_LAST_EXEC_TICKER)||"").toUpperCase();
    const pick=candidates.find(h=>(h.Ticker||"").toUpperCase()!==lastExec) || candidates[0];
    return (pick.Ticker||"").toUpperCase();
  }

  /* ===== Math: history + drawdown + vol + sharpe-ish ===== */
  function loadHist(){
    try { return JSON.parse(localStorage.getItem(LS_HIST) || "[]"); }
    catch { return []; }
  }
  function saveHist(arr){
    localStorage.setItem(LS_HIST, JSON.stringify(arr.slice(-300)));
  }
  function recordTotal(total){
    if(!isFinite(total) || total<=0) return;
    const hist=loadHist();
    hist.push({ts:Date.now(), total});
    saveHist(hist);
  }
  function computeDrawdown(){
    const hist=loadHist();
    if(hist.length<2) return {ddPct:null, peak:null, curr:null};
    let peak=-Infinity;
    for(const h of hist) if(isFinite(h.total) && h.total>peak) peak=h.total;
    const curr=hist[hist.length-1].total;
    if(!isFinite(peak)||!isFinite(curr)||peak<=0) return {ddPct:null, peak:null, curr:null};
    return {ddPct:(curr-peak)/peak, peak, curr};
  }
  function brakeLevel(ddPct){
    if(!isFinite(ddPct)) return "UNKNOWN";
    if(ddPct<=-0.10) return "FULL";
    if(ddPct<=-0.06) return "HARD";
    if(ddPct<=-0.03) return "SOFT";
    return "NONE";
  }
  function computeStats(){
    const hist=loadHist();
    if(hist.length<10) return {vol:null, sharpe:null};
    const rets=[];
    for(let i=1;i<hist.length;i++){
      const a=hist[i-1].total, b=hist[i].total;
      if(isFinite(a)&&isFinite(b)&&a>0) rets.push((b-a)/a);
    }
    if(rets.length<10) return {vol:null, sharpe:null};
    const win=rets.slice(-30);
    const mean=win.reduce((s,x)=>s+x,0)/win.length;
    const varr=win.reduce((s,x)=>s+(x-mean)*(x-mean),0)/(win.length-1);
    const vol=Math.sqrt(Math.max(varr,0));
    const sharpe=vol>0 ? (mean/vol)*Math.sqrt(252) : null;
    return {vol, sharpe};
  }
  function renderMath(){
    const {ddPct, peak}=computeDrawdown();
    const brake=brakeLevel(ddPct);

    if (valBrake){
      valBrake.textContent=brake;
      valBrake.style.color=(brake==="NONE")?"#7CFF9E":(brake==="SOFT")?"#FFD37C":"#FF8080";
    }

    setText(mathDD, isFinite(ddPct)?`Drawdown: ${(ddPct*100).toFixed(2)}%`:"Drawdown: —");
    setText(mathPeak, isFinite(peak)?`Peak: ${money(peak)}`:"Peak: —");

    const stats=computeStats();
    setText(mathVol, (stats.vol!==null)?`Vol(30): ${(stats.vol*100).toFixed(2)}%`:"Vol(30): —");
    setText(mathSharpe, (stats.sharpe!==null)?`Sharpe-ish: ${stats.sharpe.toFixed(2)}`:"Sharpe-ish: —");
  }

  /* ===== Market gate + ramp sizing ===== */
  function marketAllowsDeploy(){
    const regime=safeUpper(valRegime?.textContent);
    const vol=safeUpper(valVol?.textContent);
    const liq=safeUpper(valLiq?.textContent);

    const {ddPct}=computeDrawdown();
    const brake=brakeLevel(ddPct);

    if(brake==="FULL" || brake==="HARD") return { ok:false, why:`Brake ${brake}`, cap:0 };
    if(regime.includes("DEFENSIVE")) return { ok:false, why:"Regime DEFENSIVE", cap:0 };
    if(vol.includes("HOT") || vol.includes("🔴")) return { ok:false, why:"Volatility HOT", cap:0 };
    if(liq.includes("TIGHT")) return { ok:false, why:"Liquidity TIGHT", cap:0 };

    if(brake==="SOFT") return { ok:true, why:"Brake SOFT (core-only)", cap:50 };
    return { ok:true, why:"Conditions OK", cap:RAMP_MAX };
  }

  function chooseRampAmount(gate){
    if(!gate.ok) return 0;
    if(gate.cap===50) return 50;

    const vol=safeUpper(valVol?.textContent);
    if(vol.includes("WATCH") || vol.includes("🟡")) return RAMP_DEFAULT;
    if(vol.includes("CALM") || vol.includes("🟢")) return RAMP_MAX;

    return RAMP_DEFAULT;
  }

  function updateLastExecBadge(){
    const tkr=localStorage.getItem(LS_LAST_EXEC_TICKER);
    const tier=localStorage.getItem(LS_LAST_EXEC_TIER);
    const ts=localStorage.getItem(LS_LAST_EXEC_TS);

    if(!tkr || !ts){
      setText(lastExecBadge, "Last executed: —");
      return;
    }
    setText(lastExecBadge, `Last executed: ${tkr} (${tier||"—"}) @ ${new Date(parseInt(ts,10)).toLocaleString()}`);
  }

  // ✅ Executed checkbox indicator
  function updateExecutedVisual(){
    const tkr = localStorage.getItem(LS_LAST_EXEC_TICKER);
    const ts  = localStorage.getItem(LS_LAST_EXEC_TS);

    if (!executedBtn || !execIcon) return;

    if (!tkr || !ts){
      executedBtn.classList.remove("done");
      execIcon.textContent = "⬜";
      return;
    }

    executedBtn.classList.add("done");
    execIcon.textContent = "✅";
  }

  function renderAction(){
    updateLastExecBadge();
    suggested={tier:null,ticker:null,amount:null};

    const gate=marketAllowsDeploy();
    const rampAmt=chooseRampAmount(gate);
    const sgNote=`SGOV locked (never sell). Daily SGOV buy: $${SGOV_DAILY}. Equity is deposit-funded.`;

    if(PHASE!=="DEPLOY"){
      setText(actionMain, "HOLD — Phase not DEPLOY");
      setText(actionReason, "Phase not set to DEPLOY.");
      setText(actionNext, "NEXT UP: —");
      setText(actionMeta, "Tier: — | Ticker: —");
      return;
    }

    if(!gate.ok || rampAmt===0){
      setText(actionMain, "HOLD — Preserve down payment cash");
      setText(actionReason, `Reason: ${gate.why}. ${sgNote}`);
      setText(actionNext, "NEXT UP: Wait for conditions to improve");
      setText(actionMeta, "Tier: — | Ticker: —");
      return;
    }

    const lastTier=localStorage.getItem(LS_LAST_EXEC_TIER) || "";
    const tier=nextTierFromLast(lastTier);
    const tkr=pickNextTickerForTier(tier);

    if(!tkr){
      setText(actionMain, `BUY $${rampAmt} (Fix RiskTier values)`);
      setText(actionReason, `No ticker found for Tier=${tier}. ${sgNote}`);
      setText(actionNext, `NEXT UP: ${tier} tier`);
      setText(actionMeta, `Tier: ${tier} | Ticker: —`);
      return;
    }

    setText(actionMain, `BUY $${rampAmt} ${tkr} (Deposit-Funded)`);
    setText(actionReason, `Rotation: ${tier}. ${gate.why}. ${sgNote}`);
    setText(actionNext, `NEXT UP: ${nextTierFromLast(tier)} tier`);
    setText(actionMeta, `Tier: ${tier} | Ticker: ${tkr}`);

    suggested={tier,ticker:tkr,amount:rampAmt};
  }

  // ---------- SYSTEM loader ----------
  async function loadSystem(){
    if(!systemUrl?.value) return;

    const rows=parseCSV(await fetchText(systemUrl.value));
    const map=new Map();
    for (const r of rows){
      const k = safeUpper(r[0]);
      const v = (r[1] ?? "").toString().trim();
      if (!k) continue;
      if (k === "METRIC" || k === "KEY") continue;
      if (safeUpper(v) === "VALUE") continue;
      map.set(k, v);
    }

    setText(valRegime, map.get("MARKET REGIME")||"—");
    setText(valDeploy, map.get("DEPLOYMENT SIGNAL")||"—");
    setText(valCash, map.get("CASH ANCHOR %")||"—");
    setText(valLiq, map.get("LIQUIDITY")||"—");
    setText(valVol, map.get("VOLATILITY")||"—");
    setText(valViol, map.get("RULE VIOLATIONS")||map.get("VIOLATIONS")||"—");
  }

  // ---------- HOLDINGS loader ----------
  function buildHeaderIndex(headers){
    const map = new Map();
    headers.forEach((h,i)=>{
      const k = (h??"").toString().trim().toLowerCase();
      if (k) map.set(k, i);
    });
    return map;
  }

  function findHeader(map, candidates){
    for (const c of candidates){
      const k = c.toLowerCase();
      if (map.has(k)) return map.get(k);
    }
    return -1;
  }

  async function loadHoldings(){
    if(!holdingsUrl?.value) return;

    const rows=parseCSV(await fetchText(holdingsUrl.value));
    if (!rows.length) throw new Error("Holdings CSV empty");

    const headers=rows[0];
    const hmap=buildHeaderIndex(headers);

    const iTicker = findHeader(hmap, ["ticker","symbol","tkr"]);
    const iTier   = findHeader(hmap, ["risktier","risk tier","tier"]);
    const iValue  = findHeader(hmap, ["value","market value","market_value","mv","value usd","value ($)"]);

    if(iTicker < 0){
      if (holdingsBody) holdingsBody.innerHTML = `<tr><td colspan="3">❌ CSV missing a Ticker column.</td></tr>`;
      holdingsData=[];
      setText(totalValue, "$—");
      return;
    }

    holdingsData=[];
    let total=0;
    const out=[];

    for(let i=1;i<rows.length;i++){
      const r=rows[i];
      const tickerRaw = r[iTicker];
      if(!tickerRaw) continue;

      const ticker = safeUpper(tickerRaw);
      const tier = (iTier>=0 ? (r[iTier]||"") : "");
      const val = (iValue>=0 ? coerceNumber(r[iValue]) : NaN);

      if (isFinite(val)) total += val;

      holdingsData.push({Ticker:ticker, RiskTier:tier, Value:isFinite(val)?val:0});

      out.push(`<tr>
        <td class="mono">${ticker}</td>
        <td>${tier}</td>
        <td class="right">${isFinite(val) ? money(val) : "$—"}</td>
      </tr>`);
    }

    if (holdingsBody) holdingsBody.innerHTML = out.join("") || `<tr><td colspan="3">No rows.</td></tr>`;
    setText(totalValue, money(total));

    recordTotal(total);
  }

  /* ✅ system loads FIRST, then holdings, then render */
  async function refreshAll(label){
    if (inFlight) return;
    inFlight = true;
    try{
      await loadSystem();
      await loadHoldings();

      renderMath();
      renderAction();
      updateExecutedVisual();

      stamp(label);
    }catch(e){
      setText(statusLine, "ERROR: " + (e.message || "unknown"));
      console.error(e);
    } finally {
      inFlight = false;
    }
  }

  // Executed button records state
  if (executedBtn) executedBtn.onclick = () => {
    if(!suggested.ticker || !suggested.tier){
      setText(statusLine, "Nothing to record yet (no valid BUY suggestion).");
      return;
    }
    localStorage.setItem(LS_LAST_EXEC_TICKER, suggested.ticker);
    localStorage.setItem(LS_LAST_EXEC_TIER, suggested.tier);
    localStorage.setItem(LS_LAST_EXEC_TS, String(Date.now()));
    setText(statusLine, `Recorded executed: ${suggested.ticker} (${suggested.tier}) ✅`);
    updateExecutedVisual();
    renderAction();
  };

  // Buttons
  if (saveBtn) saveBtn.onclick = () => {
    localStorage.setItem(LS_HOLDINGS, holdingsUrl?.value || "");
    localStorage.setItem(LS_SYSTEM, systemUrl?.value || "");
    refreshAll("Saved + refreshed");
  };
  if (refreshBtn) refreshBtn.onclick = () => refreshAll("Manual refresh");
  if (runScanBtn) runScanBtn.onclick = () => refreshAll("Scan complete");

  // Initial
  if (holdingsUrl) holdingsUrl.value = localStorage.getItem(LS_HOLDINGS) || holdingsUrl.value || "";
  if (systemUrl)   systemUrl.value   = localStorage.getItem(LS_SYSTEM) || systemUrl.value || "";
  refreshAll("Loaded");

  // Auto refresh
  let secondsLeft=60;
  setInterval(()=>{
    secondsLeft--;
    setText(nextRefresh, "Next refresh in: " + secondsLeft + "s");
    if(secondsLeft<=0){
      secondsLeft=60;
      setText(statusLine, "Auto-refresh…");
      refreshAll("Auto-refresh complete");
    }
  },1000);

});
</script>
