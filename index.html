function setText(el, txt){

function stamp(label){

function money(n){
  return isFinite(n)
    ? n.toLocaleString(undefined,{style:"currency",currency:"USD"})
    : "$—"
}

function safeUpper(s){
  return (s||"").toString().trim().toUpperCase()
}

function normalizeTier(t){
  const x=safeUpper(t)
  if(x.startsWith("H")) return "HIGH"
  if(x.startsWith("M")) return "MED"
  if(x.startsWith("L")) return "LOW"
  return ""
}

function coerceNumber(v){
  if(v===null||v===undefined) return NaN
  const s=String(v).replace(/[$,%\s]/g,"").replace(/,/g,"").trim()
  if(!s) return NaN
  return Number(s)
}

function clamp(n,min,max){
  return Math.max(min,Math.min(max,n))
}

function mean(arr){
  if(!arr.length) return null
  return arr.reduce((s,x)=>s+x,0)/arr.length
}

function stdDev(arr){
  if(arr.length<2) return null
  const m=mean(arr)
  const variance=arr.reduce((s,x)=>s+Math.pow(x-m,2),0)/(arr.length-1)
  return Math.sqrt(variance)
}

function percentile(arr,p){
  if(!arr.length) return null
  const s=[...arr].sort((a,b)=>a-b)
  const idx=(s.length-1)*p
  const lo=Math.floor(idx)
  const hi=Math.ceil(idx)
  if(lo===hi) return s[lo]
  return s[lo]+(s[hi]-s[lo])*(idx-lo)
}

function fmtPct(n,d=1){
  return isFinite(n) ? `${(n*100).toFixed(d)}%` : "—"
}

/* ============================
   CSV parsing
============================ */

async function fetchText(url){
  const sep=url.includes("?")?"&":"?"
  const res=await fetch(url+sep+"t="+Date.now(),{cache:"no-store"})
  if(!res.ok) throw new Error("Fetch failed: "+res.status)
  const text=await res.text()
  if(text.trim().startsWith("<")) throw new Error("URL returned HTML not CSV")
  return text
}

function parseCSV(text){
  const rows=[]
  let row=[],cur="",inQuotes=false

  const t=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n")

  for(let i=0;i<t.length;i++){
    const c=t[i],n=t[i+1]

    if(inQuotes){
      if(c=='"' && n=='"'){cur+='"';i++;continue}
      if(c=='"'){inQuotes=false;continue}
      cur+=c
      continue
    }

    if(c=='"'){inQuotes=true;continue}
    if(c==","){row.push(cur);cur="";continue}
    if(c=="\n"){row.push(cur);rows.push(row);row=[];cur="";continue}

    cur+=c
  }

  if(cur.length||row.length){row.push(cur);rows.push(row)}

  return rows
}

/* ============================
   History / drawdown
============================ */

function loadHist(){
  try{return JSON.parse(localStorage.getItem(LS_HIST)||"[]")}
  catch{return[]}
}

function saveHist(arr){
  localStorage.setItem(LS_HIST,JSON.stringify(arr.slice(-300)))
}

function recordTotal(total){
  if(!isFinite(total)||total<=0)return
  const hist=loadHist()
  hist.push({ts:Date.now(),total})
  saveHist(hist)
}

function computeDrawdown(){
  const hist=loadHist()
  if(hist.length<2)return{ddPct:null,peak:null}

  let peak=-Infinity
  for(const h of hist) if(h.total>peak) peak=h.total

  const curr=hist[hist.length-1].total
  return{ddPct:(curr-peak)/peak,peak}
}

function brakeLevel(ddPct){
  if(!isFinite(ddPct))return"UNKNOWN"
  if(ddPct<=-0.10)return"FULL"
  if(ddPct<=-0.06)return"HARD"
  if(ddPct<=-0.03)return"SOFT"
  return"NONE"
}

function computeStats(){
  const hist=loadHist()
  if(hist.length<10)return{vol:null,sharpe:null,rets:[]}

  const rets=[]
  for(let i=1;i<hist.length;i++){
    const a=hist[i-1].total,b=hist[i].total
    if(a>0)rets.push((b-a)/a)
  }

  const win=rets.slice(-30)
  if(win.length<2) return {vol:null,sharpe:null,rets}

  const m=mean(win)
  const sd=stdDev(win)

  const vol=sd
  const sharpe=vol>0?(m/vol)*Math.sqrt(252):null

  return{vol,sharpe,rets}
}

function renderMath(){
  const{ddPct,peak}=computeDrawdown()
  const brake=brakeLevel(ddPct)

  setText(valBrake,brake)
  setText(mathDD,isFinite(ddPct)?`Drawdown ${(ddPct*100).toFixed(2)}%`:"—")
  setText(mathPeak,isFinite(peak)?money(peak):"—")

  const stats=computeStats()

  setText(mathVol,stats.vol?`Vol ${(stats.vol*100).toFixed(2)}%`:"—")
  setText(mathSharpe,stats.sharpe?stats.sharpe.toFixed(2):"—")
}


/* ============================
   Bayesian confidence
============================ */

function loadBayes(){
  try{
    const o=JSON.parse(localStorage.getItem(LS_BAYES))
    if(o&&o.a&&o.b)return o
  }catch{}
  return{a:3,b:3}
}

function saveBayes(b){localStorage.setItem(LS_BAYES,JSON.stringify(b))}

function bayesPOk(){
  const{a,b}=loadBayes()
  return a/(a+b)
}

function renderConfidence(){
  const p=bayesPOk()
  const pct=Math.round(p*100)

  let emoji="🟡"
  if(p>0.65)emoji="🟢"
  if(p<0.45)emoji="🔴"

  setText(valConf,`${emoji} ${pct}%`)
}

  const rows=parseCSV(await fetchText(systemUrl.value))

  for(const r of rows){
    const k=safeUpper(r[0])
    const v=(r[1]||"").trim()
    if(!k)continue
    map.set(k,v)
  }

  setText(valRegime,map.get("MARKET REGIME")||"—")
  setText(valDeploy,map.get("DEPLOYMENT SIGNAL")||"—")
  setText(valCash,map.get("CASH ANCHOR %")||"—")
  setText(valLiq,map.get("LIQUIDITY")||"—")
  setText(valVol,map.get("VOLATILITY")||"—")
  setText(valViol,map.get("RULE VIOLATIONS")||map.get("VIOLATIONS")||"—")
}


/* ============================
   Load holdings
============================ */

async function loadHoldings(){
  if(!holdingsUrl.value)return

  const rows=parseCSV(await fetchText(holdingsUrl.value))
  const headers=rows[0]

  const idx=h=>headers.findIndex(x=>safeUpper(x)==safeUpper(h))

  const iTicker=idx("Ticker")
  const iTier=idx("RiskTier")
  const iValue=idx("Value")

  holdingsData=[]
  let total=0

  const out=[]

  for(let i=1;i<rows.length;i++){
    const r=rows[i]
    const ticker=r[iTicker]
    if(!ticker)continue

    const tier=iTier>=0?r[iTier]:""
    const val=iValue>=0?coerceNumber(r[iValue]):NaN

    if(isFinite(val))total+=val

    holdingsData.push({Ticker:ticker,RiskTier:tier,Value:val})

    out.push(`
      <tr>
        <td class="mono">${ticker}</td>
        <td>${tier}</td>
        <td class="right">${money(val)}</td>
      </tr>
    `)
  }

  holdingsBody.innerHTML=out.join("")
  setText(totalValue,money(total))

  lastTotalValue=total
  recordTotal(total)
}

const THEME_MAP={
  SGOV:"Cash",
  VOO:"Core",
  SPY:"Core",
  IVV:"Core",
  QQQ:"Tech",
  SMH:"Tech",
  ARKQ:"Innovation",
  CRWV:"Innovation",
  XLE:"Energy",
  VXUS:"International",
  MSOS:"Cannabis",
  TLRY:"Cannabis",
  CGC:"Cannabis",
  HYFM:"Cannabis",
  FIX:"Industrials",
  CRH:"Industrials",
  RVI:"Industrials"
}

function getThemeRows(){
  const totals=new Map()
  let grand=0

  for(const h of holdingsData){
    const theme=THEME_MAP[safeUpper(h.Ticker)]||"Other"
    const val=Number(h.Value||0)
    if(!isFinite(val))continue
    totals.set(theme,(totals.get(theme)||0)+val)
    grand+=val
  }

  const rows=[...totals.entries()]
    .map(([theme,val])=>({theme,val,pct:grand>0?val/grand:0}))
    .sort((a,b)=>b.val-a.val)

  return rows
}

function renderHeatmap(){
  if(!heatmapMount)return

  const rows=getThemeRows()
  lastThemeRows=rows

  heatmapMount.innerHTML=rows.map(r=>{
    const width=Math.round(r.pct*100)

    let color="var(--green)"
    if(r.pct>0.30)color="var(--yellow)"
    if(r.pct>0.60)color="var(--red)"

    return`
<div style="display:grid;grid-template-columns:120px 1fr 60px;gap:10px;margin:8px 0">
  <div>${r.theme}</div>
  <div style="background:#111;border-radius:10px;overflow:hidden">
    <div style="width:${width}%;height:12px;background:${color}"></div>
  </div>
  <div style="text-align:right">${(r.pct*100).toFixed(1)}%</div>
</div>
`
  }).join("")
}

function getPortfolioReturns(){
  const hist=loadHist()
  if(hist.length<2) return []
  const rets=[]
  for(let i=1;i<hist.length;i++){
    const a=hist[i-1].total
    const b=hist[i].total
    if(a>0 && isFinite(a) && isFinite(b)){
      rets.push((b-a)/a)
    }
  }
  return rets
}

function computePortfolioCone(days=20,runs=800){
  const rets=getPortfolioReturns().slice(-120)
  if(!rets.length || !isFinite(lastTotalValue) || lastTotalValue<=0){
    return {p10:lastTotalValue,p25:lastTotalValue,p50:lastTotalValue,p75:lastTotalValue,p90:lastTotalValue}
  }

  const endVals=[]
  for(let r=0;r<runs;r++){
    let value=lastTotalValue
    for(let d=0;d<days;d++){
      const pick=rets[Math.floor(Math.random()*rets.length)] || 0
      value*=1+pick
    }
    endVals.push(value)
  }

  return {
    p10:percentile(endVals,0.10),
    p25:percentile(endVals,0.25),
    p50:percentile(endVals,0.50),
    p75:percentile(endVals,0.75),
    p90:percentile(endVals,0.90)
  }
}

function classifyVolState(){
  const rets=getPortfolioReturns()
  const recent=rets.slice(-20)
  const base=rets.slice(-90)

  if(recent.length<5 || base.length<10){
    return {label:"🟡 Limited data", color:C.yellow, ratio:null}
  }

  const rv=stdDev(recent)
  const bv=stdDev(base)

  if(!isFinite(rv) || !isFinite(bv) || bv<=0){
    return {label:"🟡 Limited data", color:C.yellow, ratio:null}
  }

  const ratio=rv/bv

  if(ratio<0.85) return {label:"🟢 Quiet", color:C.green, ratio}
  if(ratio<1.25) return {label:"🟡 Normal", color:C.yellow, ratio}
  return {label:"🔴 Hot", color:C.red, ratio}
}

function computeConsensus(){
  let score=50

  const regime=safeUpper(valRegime?.textContent)
  const deploy=safeUpper(valDeploy?.textContent)
  const liq=safeUpper(valLiq?.textContent)
  const vol=safeUpper(valVol?.textContent)
  const viol=safeUpper(valViol?.textContent)
  const brake=safeUpper(valBrake?.textContent)

  if(regime.includes("RISK ON") || regime.includes("BULL") || regime.includes("FAVORABLE")) score+=12
  if(regime.includes("MIXED") || regime.includes("NEUTRAL")) score+=0
  if(regime.includes("DEFENSIVE")) score-=18

  if(deploy.includes("ON") || deploy.includes("YES") || deploy.includes("GO")) score+=10
  if(deploy.includes("OFF") || deploy.includes("NO")) score-=12

  if(liq.includes("GOOD") || liq.includes("HIGH") || liq.includes("STRONG")) score+=8
  if(liq.includes("TIGHT") || liq.includes("LOW") || liq.includes("WEAK")) score-=8

  if(vol.includes("QUIET") || vol.includes("LOW")) score+=8
  if(vol.includes("NORMAL")) score+=0
  if(vol.includes("HOT") || vol.includes("HIGH")) score-=12

  if(viol.includes("0") || viol.includes("NONE")) score+=6
  else if(viol && viol!=="—") score-=10

  if(brake==="NONE") score+=8
  if(brake==="SOFT") score-=5
  if(brake==="HARD") score-=12
  if(brake==="FULL") score-=20

  const bayes=Math.round(bayesPOk()*100)
  score += Math.round((bayes-50)*0.35)

  score=clamp(score,0,100)

  if(score>=67) return {score,label:"🟢 Go",color:C.green}
  if(score<=33) return {score,label:"🔴 Caution",color:C.red}
  return {score,label:"🟡 Mixed",color:C.yellow}
}

function computeRegimePanel(){
  const volState=classifyVolState()
  const dd=computeDrawdown()
  const brake=brakeLevel(dd.ddPct)
  const regime=safeUpper(valRegime?.textContent)

  let label="🟡 Mixed"
  let color=C.yellow

  if(regime.includes("DEFENSIVE") || brake==="FULL" || brake==="HARD" || volState.label.includes("Hot")){
    label="🔴 Defensive"
    color=C.red
  }else if((regime.includes("RISK") || regime.includes("BULL") || regime.includes("FAVORABLE")) && brake==="NONE" && !volState.label.includes("Hot")){
    label="🟢 Risk-On"
    color=C.green
  }

  return {
    label,
    color,
    ddPct:dd.ddPct,
    peak:dd.peak,
    brake,
    volState
  }
}

function computeOverlapRead(){
  const rows=lastThemeRows.length ? lastThemeRows : getThemeRows()
  const top=rows.slice(0,4)

  let concentrationScore=0
  if(top[0]?.pct) concentrationScore+=top[0].pct
  if(top[1]?.pct) concentrationScore+=top[1].pct*0.75
  if(top[2]?.pct) concentrationScore+=top[2].pct*0.5

  let label="🟢 Diversified"
  let color=C.green
  if(concentrationScore>0.90){
    label="🔴 Concentrated"
    color=C.red
  }else if(concentrationScore>0.65){
    label="🟡 Moderate overlap"
    color=C.yellow
  }

  return {rows:top,label,color,concentrationScore}
}

/* ============================
   Action engine
============================ */

function marketAllowsDeploy(){
  const regime=safeUpper(valRegime.textContent)
  const vol=safeUpper(valVol.textContent)

  if(regime.includes("DEFENSIVE"))return{ok:false,why:"Defensive"}
  if(vol.includes("HOT"))return{ok:false,why:"Volatility"}

  return{ok:true,why:"Conditions OK"}
}

function chooseRampAmount(gate){
  if(!gate.ok)return 0

  const base=RAMP_DEFAULT
  const scaled=Math.round(base*(0.75+(bayesPOk()-0.5)*0.5))

  return Math.max(25,Math.min(RAMP_MAX,scaled))
}

function nextTierFromLast(last){
  const L=normalizeTier(last)

  if(L==="HIGH")return"LOW"
  if(L==="LOW")return"MED"
  if(L==="MED")return"LOW"

  return"LOW"
}

function pickNextTickerForTier(tier){
  const t=normalizeTier(tier)

  const candidates=holdingsData.filter(
    h=>normalizeTier(h.RiskTier)===t && safeUpper(h.Ticker)!=="SGOV"
  )

  if(!candidates.length)return null

  return safeUpper(candidates[0].Ticker)
}

function renderAction(){
  suggested={tier:null,ticker:null,amount:null}

  const gate=marketAllowsDeploy()
  const amt=chooseRampAmount(gate)

  if(!gate.ok){
    setText(actionMain,"HOLD")
    setText(actionReason,gate.why)
    setText(actionNext,"—")
    setText(actionMeta,"Gate closed")
    return
  }

  const lastTier=localStorage.getItem(LS_LAST_EXEC_TIER)||""

  const tier=nextTierFromLast(lastTier)
  const tkr=pickNextTickerForTier(tier)

  if(!tkr){
    setText(actionMain,"No ticker found")
    setText(actionReason,"No matching tier candidate")
    setText(actionNext,"—")
    setText(actionMeta,`Tier ${tier}`)
    return
  }

  setText(actionMain,`BUY $${amt} ${tkr}`)
  setText(actionReason,gate.why)
  setText(actionNext,`Next ${nextTierFromLast(tier)}`)
  setText(actionMeta,`Tier ${tier} | ${tkr}`)

  suggested={tier,ticker:tkr,amount:amt}
}


/* ============================
   Refresh pipeline
============================ */

async function refreshAll(label){
  if(inFlight)return
  inFlight=true

  try{
    await loadSystem()
    await loadHoldings()

    renderHeatmap()
    renderMath()
    renderConfidence()
    renderAction()
    renderUpgradePanel()

    stamp(label)
  }catch(e){
    setText(statusLine,"ERROR")
    crash("ENGINE",e)
  }finally{
    inFlight=false
  }
}

   Buttons
============================ */

executedBtn.onclick=()=>{
  if(!suggested.ticker)return

  localStorage.setItem(LS_LAST_EXEC_TICKER,suggested.ticker)
  localStorage.setItem(LS_LAST_EXEC_TIER,suggested.tier)
  localStorage.setItem(LS_LAST_EXEC_TS,String(Date.now()))

  execIcon.textContent="✅"

  renderAction()
  renderUpgradePanel()
}

saveBtn.onclick=()=>{
  localStorage.setItem(LS_SYSTEM,systemUrl.value)
  localStorage.setItem(LS_HOLDINGS,holdingsUrl.value)
  refreshAll("Saved")
}

refreshBtn.onclick=()=>refreshAll("Refresh")
runScanBtn.onclick=()=>refreshAll("Scan")


/* ============================
   Init
============================ */

systemUrl.value=localStorage.getItem(LS_SYSTEM)||""
holdingsUrl.value=localStorage.getItem(LS_HOLDINGS)||""

renderConfidence()
refreshAll("Loaded")

let seconds=60

setInterval(()=>{
  seconds--
  setText(nextRefresh,"Next refresh in "+seconds+"s")
  if(seconds<=0){
    seconds=60
    refreshAll("Auto refresh")
  }
},1000)

})
