<script>
/* ========= Lean Terminal — Nest Mode (SGOV Locked) =========
   - SGOV is NEVER sold by the terminal.
   - Equity buys are "deposit-funded" (or use existing buying power).
   - Keeps rotation (LOW/MED/HIGH) + market gate + math panel.
   - Executed button advances rotation state.
*/

const LS_HOLDINGS="lean_holdings_csv_url";
const LS_SYSTEM="lean_system_csv_url";

// executed-state
const LS_LAST_EXEC_TICKER="lean_last_exec_ticker";
const LS_LAST_EXEC_TIER="lean_last_exec_tier";
const LS_LAST_EXEC_TS="lean_last_exec_ts";

// history (local)
const LS_HIST="lean_portfolio_hist_v1";

// settings
const PHASE="DEPLOY";
const RAMP_DEFAULT=75;     // base equity deploy
const RAMP_MAX=100;        // max equity deploy if conditions very good
const SGOV_DAILY=20;       // your daily SGOV buy (informational)
const NEST_MODE=true;      // 🔒 SGOV locked (never sell)

// elements
const statusLine=document.getElementById("statusLine");
const lastUpdated=document.getElementById("lastUpdated");
const nextRefresh=document.getElementById("nextRefresh");

const valRegime=document.getElementById("valRegime");
const valDeploy=document.getElementById("valDeploy");
const valCash=document.getElementById("valCash");
const valLiq=document.getElementById("valLiq");
const valVol=document.getElementById("valVol");
const valViol=document.getElementById("valViol");
const valBrake=document.getElementById("valBrake");

const actionMain=document.getElementById("actionMain");
const actionReason=document.getElementById("actionReason");
const actionNext=document.getElementById("actionNext");
const actionMeta=document.getElementById("actionMeta");

const executedBtn=document.getElementById("executedBtn");
const lastExecBadge=document.getElementById("lastExecBadge");

const mathDD=document.getElementById("mathDD");
const mathPeak=document.getElementById("mathPeak");
const mathVol=document.getElementById("mathVol");
const mathSharpe=document.getElementById("mathSharpe");

const holdingsUrl=document.getElementById("holdingsUrl");
const systemUrl=document.getElementById("systemUrl");
const holdingsBody=document.getElementById("holdingsBody");
const totalValue=document.getElementById("totalValue");

// runtime
let holdingsData=[];
let suggested={tier:null,ticker:null,line:null, amount:null};

function stamp(label){
  const t=new Date().toLocaleTimeString();
  lastUpdated.textContent="LAST UPDATED: "+t;
  statusLine.textContent=label+" @ "+t;
}

function money(n){
  return isFinite(n) ? n.toLocaleString(undefined,{style:"currency",currency:"USD"}) : "$—";
}

async function fetchText(url){
  const sep=url.includes("?")?"&":"?";
  const res=await fetch(url+sep+"t="+Date.now(), {cache:"no-store"});
  if(!res.ok) throw new Error("Fetch failed: "+res.status);
  return await res.text();
}

function parseCSV(text){
  if(text.trim().startsWith("<")) throw new Error("URL returned HTML not CSV (add &output=csv)");
  return text.trim().split("\n").map(r=>r.split(","));
}

function safeUpper(s){ return (s||"").toString().trim().toUpperCase(); }
function normalizeTier(t){
  const x=safeUpper(t);
  if(x.startsWith("H")) return "HIGH";
  if(x.startsWith("M")) return "MED";
  if(x.startsWith("L")) return "LOW";
  return "";
}
function nextTierFromLast(last){
  const L=normalizeTier(last);
  if(L==="HIGH") return "LOW";
  if(L==="LOW")  return "MED";
  if(L==="MED")  return "LOW";
  return "LOW";
}
function pickNextTickerForTier(tier){
  const t=normalizeTier(tier);
  const candidates=holdingsData.filter(h=>normalizeTier(h.RiskTier)===t && safeUpper(h.Ticker)!=="SGOV");
  if(candidates.length===0) return null;

  const lastExec=(localStorage.getItem(LS_LAST_EXEC_TICKER)||"").toUpperCase();
  const pick=candidates.find(h=>(h.Ticker||"").toUpperCase()!==lastExec) || candidates[0];
  return (pick.Ticker||"").toUpperCase();
}

/* ===== Math: history + drawdown + vol + sharpe-ish ===== */
function loadHist(){
  try { return JSON.parse(localStorage.getItem(LS_HIST) || "[]"); }
  catch { return []; }
}
function saveHist(arr){
  localStorage.setItem(LS_HIST, JSON.stringify(arr.slice(-300)));
}
function recordTotal(total){
  if(!isFinite(total) || total<=0) return;
  const hist=loadHist();
  hist.push({ts:Date.now(), total});
  saveHist(hist);
}
function computeDrawdown(){
  const hist=loadHist();
  if(hist.length<2) return {ddPct:null, peak:null, curr:null};
  let peak=-Infinity;
  for(const h of hist) if(isFinite(h.total) && h.total>peak) peak=h.total;
  const curr=hist[hist.length-1].total;
  if(!isFinite(peak)||!isFinite(curr)||peak<=0) return {ddPct:null, peak:null, curr:null};
  return {ddPct:(curr-peak)/peak, peak, curr};
}
function brakeLevel(ddPct){
  if(!isFinite(ddPct)) return "UNKNOWN";
  if(ddPct<=-0.10) return "FULL";
  if(ddPct<=-0.06) return "HARD";
  if(ddPct<=-0.03) return "SOFT";
  return "NONE";
}
function computeStats(){
  const hist=loadHist();
  if(hist.length<10) return {vol:null, sharpe:null};
  const rets=[];
  for(let i=1;i<hist.length;i++){
    const a=hist[i-1].total, b=hist[i].total;
    if(isFinite(a)&&isFinite(b)&&a>0) rets.push((b-a)/a);
  }
  if(rets.length<10) return {vol:null, sharpe:null};
  const win=rets.slice(-30);
  const mean=win.reduce((s,x)=>s+x,0)/win.length;
  const varr=win.reduce((s,x)=>s+(x-mean)*(x-mean),0)/(win.length-1);
  const vol=Math.sqrt(Math.max(varr,0));
  const sharpe=vol>0 ? (mean/vol)*Math.sqrt(252) : null;
  return {vol, sharpe};
}
function renderMath(){
  const {ddPct, peak}=computeDrawdown();
  const brake=brakeLevel(ddPct);
  valBrake.textContent=brake;
  valBrake.style.color = (brake==="NONE") ? "var(--green)" : (brake==="SOFT") ? "var(--yellow)" : "var(--red)";

  mathDD.textContent = isFinite(ddPct) ? `Drawdown: ${(ddPct*100).toFixed(2)}%` : "Drawdown: —";
  mathPeak.textContent = isFinite(peak) ? `Peak: ${money(peak)}` : "Peak: —";

  const stats=computeStats();
  mathVol.textContent = (stats.vol!==null) ? `Vol(30): ${(stats.vol*100).toFixed(2)}%` : "Vol(30): —";
  mathSharpe.textContent = (stats.sharpe!==null) ? `Sharpe-ish: ${stats.sharpe.toFixed(2)}` : "Sharpe-ish: —";
}

/* ===== Market gate now includes brake ===== */
function marketAllowsDeploy(){
  const regime=safeUpper(valRegime.textContent);
  const vol=safeUpper(valVol.textContent);
  const liq=safeUpper(valLiq.textContent);

  const {ddPct}=computeDrawdown();
  const brake=brakeLevel(ddPct);

  // Brake overrides everything
  if(brake==="FULL" || brake==="HARD") return { ok:false, why:`Brake ${brake}` };
  if(regime.includes("DEFENSIVE")) return { ok:false, why:"Regime DEFENSIVE" };
  if(vol.includes("HOT") || vol.includes("🔴")) return { ok:false, why:"Volatility HOT" };
  if(liq.includes("TIGHT")) return { ok:false, why:"Liquidity TIGHT" };

  // SOFT brake still allows tiny/core-only deployment
  if(brake==="SOFT") return { ok:true, why:"Brake SOFT (core-only)", cap:50 };

  return { ok:true, why:"Conditions OK", cap:RAMP_MAX };
}

/* ===== Ramp sizing (75-100 based on conditions) ===== */
function chooseRampAmount(gate){
  // gate.cap is either 50 (soft brake) or 100 (good)
  // Use volatility label as an extra limiter
  const vol=safeUpper(valVol.textContent);

  if(!gate.ok) return 0;
  if(gate.cap===50) return 50;

  // If volatility is WATCH, stay at default
  if(vol.includes("WATCH") || vol.includes("🟡")) return RAMP_DEFAULT;

  // If calm-ish, allow max
  if(vol.includes("CALM") || vol.includes("🟢")) return RAMP_MAX;

  // Fallback
  return RAMP_DEFAULT;
}

function updateLastExecBadge(){
  const tkr=localStorage.getItem(LS_LAST_EXEC_TICKER);
  const tier=localStorage.getItem(LS_LAST_EXEC_TIER);
  const ts=localStorage.getItem(LS_LAST_EXEC_TS);
  if(!tkr || !ts){ lastExecBadge.textContent="Last executed: —"; return; }
  lastExecBadge.textContent=`Last executed: ${tkr} (${tier||"—"}) @ ${new Date(parseInt(ts,10)).toLocaleString()}`;
}

function renderAction(){
  updateLastExecBadge();
  suggested={tier:null,ticker:null,line:null, amount:null};

  // Always show SGOV daily behavior (informational in reason)
  const sgNote = `SGOV locked (Nest Mode). Daily SGOV buy: $${SGOV_DAILY}.`;

  if(PHASE!=="DEPLOY"){
    actionMain.textContent="HOLD — Phase not DEPLOY";
    actionReason.textContent="Phase not set to DEPLOY.";
    actionNext.textContent="NEXT UP: —";
    actionMeta.textContent="Tier: — | Ticker: —";
    return;
  }

  const gate=marketAllowsDeploy();
  const rampAmt=chooseRampAmount(gate);

  if(!gate.ok || rampAmt===0){
    actionMain.textContent="HOLD — Preserve down payment cash";
    actionReason.textContent=`Reason: ${gate.why}. ${sgNote} Equity buys only from deposits.`;
    actionNext.textContent="NEXT UP: Wait for conditions to improve";
    actionMeta.textContent="Tier: — | Ticker: —";
    return;
  }

  const lastTier=localStorage.getItem(LS_LAST_EXEC_TIER) || "";
  const tier=nextTierFromLast(lastTier);
  const tkr=pickNextTickerForTier(tier);

  if(!tkr){
    actionMain.textContent=`BUY $${rampAmt} (Fix RiskTier values)`;
    actionReason.textContent=`No ticker found for Tier=${tier}. Fill RiskTier=LOW/MED/HIGH. ${sgNote}`;
    actionNext.textContent=`NEXT UP: ${tier} tier`;
    actionMeta.textContent=`Tier: ${tier} | Ticker: —`;
    return;
  }

  // 🔒 SGOV never sold. This is deposit-funded.
  const line=`BUY $${rampAmt} ${tkr} (Deposit-Funded)`;
  actionMain.textContent=line;
  actionReason.textContent=`Rotation: ${tier}. ${gate.why}. ${sgNote} (No SGOV selling.)`;
  actionNext.textContent=`NEXT UP: ${nextTierFromLast(tier)} tier`;
  actionMeta.textContent=`Tier: ${tier} | Ticker: ${tkr}`;

  suggested={tier,ticker:tkr,line,amount:rampAmt};
}

async function loadSystem(){
  if(!systemUrl.value) return;
  const rows=parseCSV(await fetchText(systemUrl.value));
  const map=new Map();
  rows.forEach(r=>map.set((r[0]||"").toUpperCase(), (r[1]||"").trim()));
  valRegime.textContent=map.get("MARKET REGIME")||"—";
  valDeploy.textContent=map.get("DEPLOYMENT SIGNAL")||"—";
  valCash.textContent=map.get("CASH ANCHOR %")||"—";
  valLiq.textContent=map.get("LIQUIDITY")||"—";
  valVol.textContent=map.get("VOLATILITY")||"—";
  valViol.textContent=map.get("RULE VIOLATIONS")||map.get("VIOLATIONS")||"—";
}

async function loadHoldings(){
  if(!holdingsUrl.value) return;
  const text=await fetchText(holdingsUrl.value);
  const rows=parseCSV(text);
  const headers=rows[0];
  const idx=(h)=>headers.indexOf(h);

  if(idx("Ticker")<0){
    holdingsBody.innerHTML=`<tr><td colspan="3">❌ CSV missing "Ticker" column.</td></tr>`;
    holdingsData=[];
    totalValue.textContent="$—";
    return;
  }

  holdingsData=[];
  let total=0;
  const out=[];

  for(let i=1;i<rows.length;i++){
    const r=rows[i];
    const ticker=r[idx("Ticker")];
    if(!ticker) continue;

    const val=idx("Value")>=0 ? (parseFloat(r[idx("Value")])||0) : 0;
    const tier=idx("RiskTier")>=0 ? (r[idx("RiskTier")]||"") : "";

    total+=val;
    holdingsData.push({Ticker:ticker, RiskTier:tier, Value:val});

    out.push(`<tr>
      <td>${ticker}</td>
      <td>${tier}</td>
      <td class="right">${money(val)}</td>
    </tr>`);
  }

  holdingsBody.innerHTML=out.join("") || `<tr><td colspan="3">No rows.</td></tr>`;
  totalValue.textContent=money(total);

  // Record history from total (this device)
  recordTotal(total);
}

async function refreshAll(label){
  try{
    await Promise.all([loadSystem(), loadHoldings()]);
    renderMath();
    renderAction();
    stamp(label);
  }catch(e){
    statusLine.textContent="ERROR: "+(e.message||"unknown");
  }
}

// Executed button records state and advances rotation immediately
executedBtn.onclick=()=>{
  if(!suggested.ticker || !suggested.tier){
    statusLine.textContent="Nothing to record yet (no valid BUY suggestion).";
    return;
  }
  localStorage.setItem(LS_LAST_EXEC_TICKER, suggested.ticker);
  localStorage.setItem(LS_LAST_EXEC_TIER, suggested.tier);
  localStorage.setItem(LS_LAST_EXEC_TS, String(Date.now()));
  statusLine.textContent=`Recorded executed: ${suggested.ticker} (${suggested.tier}) ✅`;
  renderAction();
};

// Buttons
document.getElementById("saveBtn").onclick=()=>{
  localStorage.setItem(LS_HOLDINGS, holdingsUrl.value);
  localStorage.setItem(LS_SYSTEM, systemUrl.value);
  refreshAll("Saved + refreshed");
};
document.getElementById("refreshBtn").onclick=()=>refreshAll("Manual refresh");
document.getElementById("runScanBtn").onclick=()=>refreshAll("Scan complete");

// Initial
holdingsUrl.value = localStorage.getItem(LS_HOLDINGS) || "";
systemUrl.value   = localStorage.getItem(LS_SYSTEM) || "";
refreshAll("Loaded");

// Auto refresh
let secondsLeft=60;
setInterval(()=>{
  secondsLeft--;
  nextRefresh.textContent="Next refresh in: "+secondsLeft+"s";
  if(secondsLeft<=0){
    secondsLeft=60;
    statusLine.textContent="Auto-refresh…";
    refreshAll("Auto-refresh complete");
  }
},1000);

</script>
