<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lean Terminal — Nest Mode</title>

<style>
body {
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  margin: 0;
  padding: 20px;
  background: #0b0b0c;
  color: #eaeaea;
}
.row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin: 10px 0; }
.pill {
  padding: 6px 12px;
  border: 1px solid #333;
  border-radius: 999px;
  background:#121214;
}
button {
  padding: 8px 12px;
  border-radius: 10px;
  border: 1px solid #333;
  background:#17171a;
  color:#eaeaea;
  cursor:pointer;
}
button:hover { background:#1f1f24; }
.errorBox {
  margin-top:20px;
  padding:12px;
  border:1px solid #550000;
  background:#1a0000;
  color:#ff8080;
  font-family: monospace;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<h1>Lean Terminal — Nest Mode</h1>

<div class="row">
  <div class="pill" id="statusLine">Loaded</div>
  <div class="pill" id="lastUpdated">LAST UPDATED: —</div>
  <div class="pill" id="nextRefresh">Next refresh in: —</div>
</div>

<h2>Good Morning</h2>

<div class="row">
  <button id="runScanBtn">Run Scan</button>
  <div class="pill" id="lastExecBadge">Last executed: —</div>
</div>

<div class="row">
  <div class="pill">Regime: <span id="valRegime">—</span></div>
  <div class="pill">Deployment: <span id="valDeploy">—</span></div>
  <div class="pill">Cash: <span id="valCash">—</span></div>
  <div class="pill">Liquidity: <span id="valLiq">—</span></div>
  <div class="pill">Volatility: <span id="valVol">—</span></div>
  <div class="pill">Violations: <span id="valViol">—</span></div>
</div>

<div id="errorContainer"></div>

<script>
/* ===========================
   SAFE UTILITIES
=========================== */

function safeJSONParse(raw, fallback) {
  try { return raw ? JSON.parse(raw) : fallback; }
  catch { return fallback; }
}

function safeSetText(id, value) {
  const el = document.getElementById(id);
  if (el) el.textContent = value ?? "—";
}

function showError(err) {
  const box = document.createElement("div");
  box.className = "errorBox";
  box.textContent = "APP CRASHED:\n\n" + (err?.stack || err);
  document.getElementById("errorContainer").appendChild(box);
}

/* ===========================
   RISK TIER CONFIG
=========================== */

const RISK_TIERS = {
  LOW:  { ticker: "VOO", buyUsd: 75 },
  MED:  { ticker: "QQQ", buyUsd: 75 },
  HIGH: { ticker: "SMH", buyUsd: 75 }
};

/* ===========================
   MAIN APP
=========================== */

window.addEventListener("DOMContentLoaded", () => {
  try {

    // Restore saved state safely
    const savedState = safeJSONParse(localStorage.getItem("lean_state"), {
      tier: "LOW",
      lastExecuted: null
    });

    const tier = (savedState.tier || "LOW").trim().toUpperCase();
    const tierCfg = RISK_TIERS[tier] || null;

    safeSetText("statusLine", "System Online");
    safeSetText("lastUpdated", "LAST UPDATED: " + new Date().toLocaleTimeString());
    safeSetText("nextRefresh", "Next refresh in: 60s");

    safeSetText("valRegime", "Neutral");
    safeSetText("valDeploy", tierCfg ? "$" + tierCfg.buyUsd : "N/A");
    safeSetText("valCash", "—");
    safeSetText("valLiq", "—");
    safeSetText("valVol", "—");
    safeSetText("valViol", "—");

    if (tierCfg) {
      safeSetText("lastExecBadge",
        "Tier: " + tier + " | Ticker: " + tierCfg.ticker);
    } else {
      safeSetText("lastExecBadge",
        "Tier " + tier + " missing mapping");
    }

    document.getElementById("runScanBtn").addEventListener("click", () => {
      safeSetText("statusLine", "Running Scan...");
      setTimeout(() => {
        safeSetText("statusLine", "Scan Complete");
        safeSetText("lastUpdated",
          "LAST UPDATED: " + new Date().toLocaleTimeString());
      }, 800);
    });

  } catch (err) {
    showError(err);
  }
});
</script>

</body>
</html>
