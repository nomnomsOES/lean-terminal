<!DOCTYPE html>
<html>
<head>
  <title>Lean Terminal</title>
  <style>
    body { margin:0; background:#0b0b0f; color:white; font-family:Arial; }
    .container { padding:20px; display:grid; grid-template-columns: 1fr 320px; gap:20px; }
    .card { background:#15151b; border:1px solid #2a2a33; border-radius:16px; padding:16px; }
    .title { font-size:28px; font-weight:bold; }
    .pill-row { display:flex; gap:10px; margin-top:15px; flex-wrap:wrap; }
    .pill { padding:10px; border-radius:10px; border:1px solid #333; background:#1a1a22; }
    .section { margin-top:20px; }
    .row { display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #222; cursor:pointer; }
    .row:hover { background:#1f1f2a; }
    .buy { color:#4ade80; }
    .sell { color:#f87171; }
    .side { display:flex; flex-direction:column; gap:10px; }
  </style>
</head>

<body>

<div class="container">

  <!-- LEFT -->
  <div>

    <div class="card">
      <div class="title">🚀 Lean Terminal</div>
      <div>Live Behavior Engine</div>
    </div>

    <div class="pill-row">
      <div class="pill">READY: <span id="ready"></span></div>
      <div class="pill">RISK: <span id="risk"></span></div>
      <div class="pill">PLAN: <span id="plan"></span></div>
    </div>

    <div class="card section">
      <h3>🐎 Action</h3>
      <div id="buyList"></div>
      <div id="sellList"></div>
    </div>

    <div class="card section">
      <h3>📊 Rank Engine</h3>
      <div id="rankTable"></div>
    </div>

  </div>

  <!-- RIGHT -->
  <div class="side">

    <div class="card">
      <h3>📈 DNA</h3>
      <div id="dna">Click a stock</div>
    </div>

    <div class="card">
      <h3>🧠 I</h3>
      <div>READY = strength</div>
      <div>RISK = danger</div>
    </div>

  </div>

</div>

<script>

// ================= CSV LINKS =================
const URLS = {
  action: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSu4GvMP2KBmt8Mfj1Scw8W5DGikJ5_sPzrjQ-cf2Non1IR7VO9phD7tKPXduZT35yLh5PwYOrawynS/pub?gid=1225083168&single=true&output=csv",
  ranking: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSu4GvMP2KBmt8Mfj1Scw8W5DGikJ5_sPzrjQ-cf2Non1IR7VO9phD7tKPXduZT35yLh5PwYOrawynS/pub?gid=2095403822&single=true&output=csv",
  markov: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSu4GvMP2KBmt8Mfj1Scw8W5DGikJ5_sPzrjQ-cf2Non1IR7VO9phD7tKPXduZT35yLh5PwYOrawynS/pub?gid=643415500&single=true&output=csv",
  dna: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSu4GvMP2KBmt8Mfj1Scw8W5DGikJ5_sPzrjQ-cf2Non1IR7VO9phD7tKPXduZT35yLh5PwYOrawynS/pub?gid=425314096&single=true&output=csv"
};

// ================= CSV PARSER =================
function parseCSV(text) {
  const lines = text.split("\n");
  const headers = lines[0].split(",");
  return lines.slice(1).map(line => {
    const values = line.split(",");
    let obj = {};
    headers.forEach((h,i)=>obj[h.trim()] = values[i]);
    return obj;
  });
}

// ================= LOAD DATA =================
async function loadData() {
  const action = await fetch(URLS.action).then(r=>r.text()).then(parseCSV);
  const ranking = await fetch(URLS.ranking).then(r=>r.text()).then(parseCSV);

  render(action, ranking);
}

// ================= RENDER =================
function render(action, ranking){

  const avg = arr => arr.reduce((a,b)=>a+Number(b||0),0)/arr.length;

  const scores = action.map(x=>Number(x.FINAL_SCORE||0));
  const risks = action.map(x=>Number(x.RISK||0));

  const ready = Math.round(avg(scores));
  const risk = Math.round(avg(risks));
  const plan = (ready > 78 && risk < 50) ? "AGG" : "LEAN";

  document.getElementById("ready").innerText = ready;
  document.getElementById("risk").innerText = risk;
  document.getElementById("plan").innerText = plan;

  // BUY / SELL
  const buys = action.filter(x=>x.FINAL_ACTION==="BUY");
  const sells = action.filter(x=>x.FINAL_ACTION==="SELL");

  document.getElementById("buyList").innerHTML =
    "<b class='buy'>BUY:</b><br>" +
    buys.map(x=>`${x.TICKER}`).join("<br>");

  document.getElementById("sellList").innerHTML =
    "<br><b class='sell'>SELL:</b><br>" +
    sells.map(x=>`${x.TICKER}`).join("<br>");

  // RANK TABLE
  document.getElementById("rankTable").innerHTML =
    ranking.map(x => `
      <div class="row" onclick="showDNA('${x.TICKER}')">
        <div>${x.TICKER}</div>
        <div>${x.FINAL_RANK_SCORE}</div>
      </div>
    `).join("");
}

// ================= DNA =================
async function showDNA(ticker){
  const dna = await fetch(URLS.dna).then(r=>r.text()).then(parseCSV);
  const row = dna.find(x=>x.TICKER===ticker);

  document.getElementById("dna").innerHTML =
    `<b>${ticker}</b><br>DNA Score: ${row?.DNA_SCORE || "-"}`;
}

// INIT
loadData();

</script>

</body>
</html>
