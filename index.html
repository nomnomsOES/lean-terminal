<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lean Terminal 2.2 — Compact Auto Execute</title>
<style>
body{margin:0;background:#060c1a;color:#e8edf7;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.wrap{max-width:1420px;margin:0 auto;padding:10px}
.card{border:1px solid rgba(255,255,255,.08);border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.015));padding:10px;margin-bottom:8px}
.pill{display:inline-flex;gap:6px;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 9px;background:#0c1425;margin:4px 6px 0 0;font-size:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box{border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:10px;background:rgba(255,255,255,.02)}
.btn{border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:6px 10px;background:rgba(255,255,255,.03);color:#e8edf7;cursor:pointer}
.exec{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.35)}
.trim{background:rgba(251,113,133,.10);border-color:rgba(251,113,133,.35)}
.small{font-size:12px;color:#94a3b8}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h2 style="margin:0 0 6px 0">Lean Terminal 2.2 — Compact Auto Execute</h2>
    <div class="small">auto deploy • min score • theme cap • execute buttons auto-log to trade log</div>
    <div>
      <span class="pill">AUTO DEPLOY <strong id="autoDeploy">$0</strong></span>
      <span class="pill">MIN SCORE <strong>75</strong></span>
      <span class="pill">THEME CAP <strong>30%</strong></span>
    </div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 6px 0">Action Engine</h3>
    <div id="action"></div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 6px 0">Holdings</h3>
    <div id="holdings"></div>
  </div>
</div>

<script>
const EXEC_URL = "https://script.google.com/macros/s/AKfycbxEwsBVHCYMwtrRpam0DA70aLCLkvH3M5T2G_K-keqGe7YvXXuBGD4SKxMYPXh8vguudA/exec";

async function executeTrade(action,ticker,amount){
  const payload = {date:new Date().toISOString().slice(0,10),mode:"AGG",action,ticker,amount,reason:"from terminal"};
  await fetch(EXEC_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)});
  alert("Logged: "+ticker+" "+amount);
}

document.getElementById("action").innerHTML = `
<div class="box">
  <div class="small">TOP</div>
  <div>SMH → $120</div>
  <button class="btn exec" onclick="executeTrade('BUY','SMH',120)">EXECUTE</button>
</div>
<div class="box">
  <div class="small">SECOND</div>
  <div>CRWV → $80</div>
  <button class="btn exec" onclick="executeTrade('BUY','CRWV',80)">EXECUTE</button>
</div>
<div class="box">
  <div class="small">TRIM</div>
  <div>XLE → $50</div>
  <button class="btn exec trim" onclick="executeTrade('SELL','XLE',50)">EXECUTE</button>
</div>
`;

document.getElementById("holdings").innerHTML = "Loaded from sheet in full version";
</script>
</body>
</html>
