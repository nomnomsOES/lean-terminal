<script>
window.addEventListener("DOMContentLoaded", () => {

/* ============================
   Crash protection
============================ */

const errorBoxMount = document.getElementById("errorBoxMount")

function crash(label, err){
  const msg = (err && (err.stack || err.message)) ? (err.stack || err.message) : String(err)
  if(errorBoxMount){
    errorBoxMount.innerHTML = `<div class="errorBox">${label}\n\n${msg}</div>`
  }
  console.error(label, err)
}

window.addEventListener("error", e => crash("CRASH:", e.error || e.message))
window.addEventListener("unhandledrejection", e => crash("CRASH (promise):", e.reason))


/* ============================
   SPREADSHEET DATA SOURCES
============================ */

/* EXISTING SHEETS */

const SYSTEM_CSV =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTVxYTh77y3Ql1Inf4hTfJDXODt7cgTZWtFLkAKXEkReX8i7dTqdtfXlqsRCFcvUPdAa7iJaex3R_Z3/pub?gid=824917531&single=true&output=csv"

const HOLDINGS_CSV =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTVxYTh77y3Ql1Inf4hTfJDXODt7cgTZWtFLkAKXEkReX8i7dTqdtfXlqsRCFcvUPdAa7iJaex3R_Z3/pub?gid=0&single=true&output=csv"


/* NEW SHEETS YOU BUILT */

const MACRO_CSV =
"https://docs.google.com/spreadsheets/d/e/YOUR_MACRO_SHEET_ID/pub?gid=MACRO_GID&single=true&output=csv"

const CORRELATION_CSV =
"https://docs.google.com/spreadsheets/d/e/YOUR_CORRELATION_SHEET_ID/pub?gid=CORR_GID&single=true&output=csv"

const SHOCK_RADAR_CSV =
"https://docs.google.com/spreadsheets/d/e/YOUR_SHOCK_SHEET_ID/pub?gid=SHOCK_GID&single=true&output=csv"

const HISTORY_CSV =
"https://docs.google.com/spreadsheets/d/e/YOUR_HISTORY_SHEET_ID/pub?gid=HISTORY_GID&single=true&output=csv"


/* ============================
   SETTINGS
============================ */

const RAMP_DEFAULT = 75
const RAMP_MAX = 100
const AUTO_REFRESH_SECONDS = 60


/* ============================
   BASIC HELPERS
============================ */

const $ = id => document.getElementById(id)

function safeUpper(s){
  return (s || "").toString().trim().toUpperCase()
}

function coerceNumber(v){
  if(v===null || v===undefined) return NaN
  const s=String(v).replace(/[$,%\s]/g,"").replace(/,/g,"").trim()
  if(!s) return NaN
  return Number(s)
}

function money(n){
  return isFinite(n)
    ? n.toLocaleString(undefined,{style:"currency",currency:"USD"})
    : "$—"
}

function pct2(n){
  return isFinite(n) ? `${(n*100).toFixed(2)}%` : "—"
}


/* ============================
   CSV LOADER
============================ */

async function fetchText(url){
  if(!url) return ""
  const sep=url.includes("?")?"&":"?"
  const res=await fetch(url+sep+"t="+Date.now(),{cache:"no-store"})
  if(!res.ok) throw new Error("Fetch failed: "+res.status)
  const text=await res.text()
  return text
}

function parseCSV(text){
  const rows=[]
  let row=[],cur="",inQuotes=false
  const t=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n")
  for(let i=0;i<t.length;i++){
    const c=t[i],n=t[i+1]
    if(inQuotes){
      if(c=='"' && n=='"'){cur+='"';i++;continue}
      if(c=='"'){inQuotes=false;continue}
      cur+=c
      continue
    }
    if(c=='"'){inQuotes=true;continue}
    if(c==","){row.push(cur);cur="";continue}
    if(c=="\n"){row.push(cur);rows.push(row);row=[];cur="";continue}
    cur+=c
  }
  if(cur.length || row.length){row.push(cur);rows.push(row)}
  return rows
}


/* ============================
   MACRO PANEL
============================ */

async function loadMacro(){

  try{

    const rows=parseCSV(await fetchText(MACRO_CSV))
    if(rows.length<2) return

    const headers=rows[0]
    const data=rows[rows.length-1]

    const idx=(name)=>headers.findIndex(h=>safeUpper(h)===safeUpper(name))

    const get=(name)=>{
      const i=idx(name)
      return i>=0 ? data[i] : "—"
    }

    $("macroDate").textContent=get("Date")
    $("macro10Y").textContent=get("10Y_Treasury")
    $("macro2Y").textContent=get("2Y_Treasury")
    $("macroCurve").textContent=get("YieldCurve")
    $("macroDxy").textContent=get("DXY")
    $("macroOil").textContent=get("Oil")
    $("macroGold").textContent=get("Gold")
    $("macroVix").textContent=get("VIX")

  }catch(e){
    console.warn("Macro load failed",e)
  }

}


/* ============================
   SHOCK RADAR
============================ */

async function loadShockRadar(){

  try{

    const rows=parseCSV(await fetchText(SHOCK_RADAR_CSV))
    if(rows.length<2) return

    const headers=rows[0]

    const idx=(name)=>headers.findIndex(h=>safeUpper(h)===safeUpper(name))

    const iTheme=idx("Theme")
    const iLevel=idx("ShockLevel")
    const iStatus=idx("Status")
    const iReason=idx("Reason")
    const iScore=idx("SignalScore")

    const body=[]

    for(let i=1;i<rows.length;i++){

      const r=rows[i]

      const theme=r[iTheme]||"—"
      const level=r[iLevel]||"—"
      const status=r[iStatus]||"—"
      const reason=r[iReason]||"—"
      const score=r[iScore]||"—"

      body.push(`
        <div class="shockRow">
          <div class="shockTop">
            <div class="shockTheme">${theme}</div>
            <div class="shockPills">
              <span class="pill">${level}</span>
              <span class="pill">${status}</span>
              <span class="pill">Score ${score}</span>
            </div>
          </div>
          <div class="shockReason">${reason}</div>
        </div>
      `)
    }

    $("shockRadarMount").innerHTML=body.join("")

  }catch(e){
    console.warn("Shock radar load failed",e)
  }

}


/* ============================
   REFRESH ENGINE
============================ */

async function refreshAll(label){

  try{

    await Promise.all([
      loadMacro(),
      loadShockRadar()
    ])

  }catch(e){
    crash("ENGINE",e)
  }

}


refreshAll("Loaded")

setInterval(()=>{
  refreshAll("Auto refresh")
}, AUTO_REFRESH_SECONDS*1000)

})
</script>
