<!-- AESTHETICS PATCHED VERSION (LOGIC UNCHANGED) -->

<style>
body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}

/* Info button improved */
.i{
  width:18px;
  height:18px;
  border:1px solid var(--line);
  border-radius:999px;
  display:grid;
  place-items:center;
  font-size:11px;
  color:var(--muted);
  cursor:pointer;
  transition:.2s;
}
.i:hover{
  background:rgba(255,255,255,.08);
  color:#fff;
}

/* Scroll areas FIX */
.scroll{
  height:280px;
  overflow-y:auto;
  padding-right:4px;
}

/* ACTION card resized */
.span-action{
  grid-column:span 4;
}

/* Uniform buttons */
button{
  font-family:inherit;
}

/* Cleaner ticker look */
.tbtn{
  font-weight:700;
  font-family:inherit;
}

/* Table font fix */
table, th, td{
  font-family:inherit;
}

/* Canvas font consistency handled in JS override */
</style>

<script>
/* ===== CANVAS FONT FIX ===== */
const setCanvasFont = (ctx,size=12,weight="")=>{
  ctx.font = `${weight}${size}px system-ui`;
};

/* override drawPair font usage */
function drawPair(){
  let x=sys(),
      aName=x[0]?.ticker||"Pair A",
      bName=x[1]?.ticker||"Pair B",
      a=[100,102,108,106,120,126,133,130,142,155],
      b=[100,101,104,103,108,111,113,110,116,121],
      c=document.getElementById("pair"),
      ctx=c.getContext("2d"),
      w=c.width,h=c.height,p=28;

  let all=[...a,...b],
      mn=Math.min(...all),
      mx=Math.max(...all);

  const xx=(i,n)=>p+i*(w-p*2)/Math.max(1,n-1),
        yy=v=>h-p-((v-mn)/Math.max(1,mx-mn))*(h-p*2);

  ctx.clearRect(0,0,w,h);

  ctx.strokeStyle="rgba(255,255,255,.10)";
  for(let i=0;i<5;i++){
    let y=p+i*((h-p*2)/4);
    ctx.beginPath();
    ctx.moveTo(p,y);
    ctx.lineTo(w-p,y);
    ctx.stroke();
  }

  ctx.lineWidth=2.4;

  ctx.strokeStyle="#60a5fa";
  ctx.beginPath();
  a.forEach((v,i)=>i?ctx.lineTo(xx(i,a.length),yy(v)):ctx.moveTo(xx(i,a.length),yy(v)));
  ctx.stroke();

  ctx.strokeStyle="#22d3ee";
  ctx.beginPath();
  b.forEach((v,i)=>i?ctx.lineTo(xx(i,b.length),yy(v)):ctx.moveTo(xx(i,b.length),yy(v)));
  ctx.stroke();

  ctx.fillStyle="rgba(231,238,252,.9)";
  setCanvasFont(ctx,12);
  ctx.fillText(aName,p,16);
  ctx.fillText(bName,p+80,16);
}

/* override distribution font */
function renderDist(){
  let g={}, cols=["#60a5fa","#22d3ee","#22c55e","#f59e0b","#ef4444","#a78bfa","#f472b6","#facc15"];

  holds().forEach(h=>{
    let k=h.industry||h.theme||"Unlabeled";
    g[k]=(g[k]||0)+h.value;
  });

  let rows=Object.entries(g).sort((a,b)=>b[1]-a[1]).slice(0,8),
      c=document.getElementById("donut"),
      ctx=c.getContext("2d"),
      total=rows.reduce((a,b)=>a+b[1],0);

  ctx.clearRect(0,0,c.width,c.height);

  if(!total){
    setCanvasFont(ctx,14);
    ctx.fillStyle="rgba(255,255,255,.65)";
    ctx.fillText("No distribution data",130,115);
    return;
  }

  let start=-Math.PI/2,
      cx=110,cy=110,r=72;

  rows.forEach((row,i)=>{
    let ang=row[1]/total*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,start,start+ang);
    ctx.closePath();
    ctx.fillStyle=cols[i%cols.length];
    ctx.fill();
    start+=ang;
  });

  ctx.globalCompositeOperation="destination-out";
  ctx.beginPath();
  ctx.arc(cx,cy,42,0,Math.PI*2);
  ctx.fill();

  ctx.globalCompositeOperation="source-over";

  setCanvasFont(ctx,11);
  ctx.fillStyle="rgba(231,238,252,.95)";
  ctx.fillText("ALLOCATION",78,107);

  setCanvasFont(ctx,14,"bold ");
  ctx.fillText("$"+Math.round(pval()),76,126);
}

/* ===== INFO BUTTON FIX ===== */
document.querySelectorAll(".i").forEach(el=>{
  if(el.title){
    el.dataset.tip = el.title;
    el.removeAttribute("title");
    el.onclick = () => alert(el.dataset.tip);
  }
});
</script>
