<script>
/* ========= FAILSAFE NEST MODE SCRIPT (No White Screens) =========
   SGOV locked: never sold.
   Equity BUY is deposit-funded.
   Works even if some IDs are missing; shows error banner.
*/

(function(){
  function banner(msg){
    try{
      let b=document.getElementById("debugBanner");
      if(!b){
        b=document.createElement("div");
        b.id="debugBanner";
        b.style.cssText="position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;padding:10px 12px;border:1px solid rgba(255,255,255,.25);border-radius:12px;background:rgba(0,0,0,.85);color:#fff;font:12px/1.35 system-ui;";
        document.body.appendChild(b);
      }
      b.textContent=msg;
    }catch(e){}
  }

  try{
    // -------- settings --------
    const LS_HOLDINGS="lean_holdings_csv_url";
    const LS_SYSTEM="lean_system_csv_url";
    const LS_LAST_EXEC_TICKER="lean_last_exec_ticker";
    const LS_LAST_EXEC_TIER="lean_last_exec_tier";
    const LS_LAST_EXEC_TS="lean_last_exec_ts";
    const LS_HIST="lean_portfolio_hist_v1";

    const PHASE="DEPLOY";
    const RAMP_DEFAULT=75;
    const RAMP_MAX=100;
    const SGOV_DAILY=20;
    const NEST_MODE=true; // SGOV locked

    // -------- required elements (must exist) --------
    const statusLine=document.getElementById("statusLine");
    const holdingsUrl=document.getElementById("holdingsUrl");
    const systemUrl=document.getElementById("systemUrl");
    const holdingsBody=document.getElementById("holdingsBody");
    const totalValue=document.getElementById("totalValue");

    if(!statusLine || !holdingsUrl || !systemUrl || !holdingsBody || !totalValue){
      banner("Missing required HTML IDs. Need: statusLine, holdingsUrl, systemUrl, holdingsBody, totalValue.");
      return;
    }

    // -------- optional elements (may be missing; we guard) --------
    const lastUpdated=document.getElementById("lastUpdated");
    const nextRefresh=document.getElementById("nextRefresh");

    const valRegime=document.getElementById("valRegime");
    const valDeploy=document.getElementById("valDeploy");
    const valCash=document.getElementById("valCash");
    const valLiq=document.getElementById("valLiq");
    const valVol=document.getElementById("valVol");
    const valViol=document.getElementById("valViol");
    const valBrake=document.getElementById("valBrake");

    const actionMain=document.getElementById("actionMain");
    const actionReason=document.getElementById("actionReason");
    const actionNext=document.getElementById("actionNext");
    const actionMeta=document.getElementById("actionMeta");

    const executedBtn=document.getElementById("executedBtn");
    const lastExecBadge=document.getElementById("lastExecBadge");

    const mathDD=document.getElementById("mathDD");
    const mathPeak=document.getElementById("mathPeak");
    const mathVol=document.getElementById("mathVol");
    const mathSharpe=document.getElementById("mathSharpe");

    const runScanBtn=document.getElementById("runScanBtn");
    const refreshBtn=document.getElementById("refreshBtn");
    const saveBtn=document.getElementById("saveBtn");

    // -------- runtime --------
    let holdingsData=[];
    let suggested={tier:null,ticker:null,amount:null};

    function safeUpper(s){ return (s||"").toString().trim().toUpperCase(); }
    function normalizeTier(t){
      const x=safeUpper(t);
      if(x.startsWith("H")) return "HIGH";
      if(x.startsWith("M")) return "MED";
      if(x.startsWith("L")) return "LOW";
      return "";
    }
    function nextTierFromLast(last){
      const L=normalizeTier(last);
      if(L==="HIGH") return "LOW";
      if(L==="LOW") return "MED";
      if(L==="MED") return "LOW";
      return "LOW";
    }
    function money(n){
      return isFinite(n) ? n.toLocaleString(undefined,{style:"currency",currency:"USD"}) : "$—";
    }

    function stamp(label){
      const t=new Date().toLocaleTimeString();
      if(lastUpdated) lastUpdated.textContent="LAST UPDATED: "+t;
      statusLine.textContent=label+" @ "+t;
    }

    async function fetchText(url){
      const sep=url.includes("?")?"&":"?";
      const res=await fetch(url+sep+"t="+Date.now(), {cache:"no-store"});
      if(!res.ok) throw new Error("Fetch failed: "+res.status);
      return await res.text();
    }

    function parseCSV(text){
      if(text.trim().startsWith("<")) throw new Error("URL returned HTML not CSV (add &output=csv)");
      return text.trim().split("\n").map(r=>r.split(","));
    }

    // -------- history + math --------
    function loadHist(){
      try { return JSON.parse(localStorage.getItem(LS_HIST) || "[]"); }
      catch { return []; }
    }
    function saveHist(arr){
      localStorage.setItem(LS_HIST, JSON.stringify(arr.slice(-300)));
    }
    function recordTotal(total){
      if(!isFinite(total) || total<=0) return;
      const hist=loadHist();
      hist.push({ts:Date.now(), total});
      saveHist(hist);
    }
    function computeDrawdown(){
      const hist=loadHist();
      if(hist.length<2) return {ddPct:null, peak:null, curr:null};
      let peak=-Infinity;
      for(const h of hist) if(isFinite(h.total) && h.total>peak) peak=h.total;
      const curr=hist[hist.length-1].total;
      if(!isFinite(peak)||!isFinite(curr)||peak<=0) return {ddPct:null, peak:null, curr:null};
      return {ddPct:(curr-peak)/peak, peak, curr};
    }
    function brakeLevel(ddPct){
      if(!isFinite(ddPct)) return "UNKNOWN";
      if(ddPct<=-0.10) return "FULL";
      if(ddPct<=-0.06) return "HARD";
      if(ddPct<=-0.03) return "SOFT";
      return "NONE";
    }
    function computeStats(){
      const hist=loadHist();
      if(hist.length<10) return {vol:null, sharpe:null};
      const rets=[];
      for(let i=1;i<hist.length;i++){
        const a=hist[i-1].total, b=hist[i].total;
        if(isFinite(a)&&isFinite(b)&&a>0) rets.push((b-a)/a);
      }
      if(rets.length<10) return {vol:null, sharpe:null};
      const win=rets.slice(-30);
      const mean=win.reduce((s,x)=>s+x,0)/win.length;
      const varr=win.reduce((s,x)=>s+(x-mean)*(x-mean),0)/(win.length-1);
      const vol=Math.sqrt(Math.max(varr,0));
      const sharpe=vol>0 ? (mean/vol)*Math.sqrt(252) : null;
      return {vol, sharpe};
    }

    function renderMath(){
      const {ddPct, peak}=computeDrawdown();
      const brake=brakeLevel(ddPct);

      if(valBrake){
        valBrake.textContent=brake;
        // no CSS vars; use direct colors
        valBrake.style.color = (brake==="NONE") ? "#22c55e" : (brake==="SOFT") ? "#f59e0b" : "#ef4444";
      }
      if(mathDD) mathDD.textContent = isFinite(ddPct) ? `Drawdown: ${(ddPct*100).toFixed(2)}%` : "Drawdown: —";
      if(mathPeak) mathPeak.textContent = isFinite(peak) ? `Peak: ${money(peak)}` : "Peak: —";

      const stats=computeStats();
      if(mathVol) mathVol.textContent = (stats.vol!==null) ? `Vol(30): ${(stats.vol*100).toFixed(2)}%` : "Vol(30): —";
      if(mathSharpe) mathSharpe.textContent = (stats.sharpe!==null) ? `Sharpe-ish: ${stats.sharpe.toFixed(2)}` : "Sharpe-ish: —";
    }

    function marketGate(){
      const {ddPct}=computeDrawdown();
      const brake=brakeLevel(ddPct);

      const regime = valRegime ? safeUpper(valRegime.textContent) : "";
      const vol    = valVol ? safeUpper(valVol.textContent) : "";
      const liq    = valLiq ? safeUpper(valLiq.textContent) : "";

      if(brake==="FULL" || brake==="HARD") return {ok:false, why:"Brake "+brake, cap:0};
      if(regime.includes("DEFENSIVE")) return {ok:false, why:"Regime DEFENSIVE", cap:0};
      if(vol.includes("HOT") || vol.includes("🔴")) return {ok:false, why:"Volatility HOT", cap:0};
      if(liq.includes("TIGHT")) return {ok:false, why:"Liquidity TIGHT", cap:0};

      if(brake==="SOFT") return {ok:true, why:"Brake SOFT", cap:50};
      return {ok:true, why:"Conditions OK", cap:RAMP_MAX};
    }

    function chooseRamp(gate){
      if(!gate.ok) return 0;
      if(gate.cap===50) return 50;

      const vol = valVol ? safeUpper(valVol.textContent) : "";
      if(vol.includes("WATCH") || vol.includes("🟡")) return RAMP_DEFAULT;
      if(vol.includes("CALM") || vol.includes("🟢")) return RAMP_MAX;
      return RAMP_DEFAULT;
    }

    function pickNextTickerForTier(tier){
      const t=normalizeTier(tier);
      const candidates=holdingsData.filter(h=>normalizeTier(h.RiskTier)===t && safeUpper(h.Ticker)!=="SGOV");
      if(candidates.length===0) return null;

      const lastExec=(localStorage.getItem(LS_LAST_EXEC_TICKER)||"").toUpperCase();
      const pick=candidates.find(h=>(h.Ticker||"").toUpperCase()!==lastExec) || candidates[0];
      return (pick.Ticker||"").toUpperCase();
    }

    function updateLastExecBadge(){
      if(!lastExecBadge) return;
      const tkr=localStorage.getItem(LS_LAST_EXEC_TICKER);
      const tier=localStorage.getItem(LS_LAST_EXEC_TIER);
      const ts=localStorage.getItem(LS_LAST_EXEC_TS);
      if(!tkr || !ts){ lastExecBadge.textContent="Last executed: —"; return; }
      lastExecBadge.textContent=`Last executed: ${tkr} (${tier||"—"}) @ ${new Date(parseInt(ts,10)).toLocaleString()}`;
    }

    function renderAction(){
      updateLastExecBadge();
      suggested={tier:null,ticker:null,amount:null};

      const sgNote = `SGOV locked. Daily SGOV buy: $${SGOV_DAILY}. Equity buys are deposit-funded.`;

      if(!actionMain) return; // if action UI not present, just skip

      if(PHASE!=="DEPLOY"){
        actionMain.textContent="HOLD — Phase not DEPLOY";
        if(actionReason) actionReason.textContent="Phase not set to DEPLOY.";
        if(actionNext) actionNext.textContent="NEXT UP: —";
        if(actionMeta) actionMeta.textContent="Tier: — | Ticker: —";
        return;
      }

      const gate=marketGate();
      const amt=chooseRamp(gate);

      if(!gate.ok || amt===0){
        actionMain.textContent="HOLD — Preserve down payment cash";
        if(actionReason) actionReason.textContent=`Reason: ${gate.why}. ${sgNote}`;
        if(actionNext) actionNext.textContent="NEXT UP: Wait for conditions to improve";
        if(actionMeta) actionMeta.textContent="Tier: — | Ticker: —";
        return;
      }

      const lastTier=localStorage.getItem(LS_LAST_EXEC_TIER) || "";
      const tier=nextTierFromLast(lastTier);
      const tkr=pickNextTickerForTier(tier);

      if(!tkr){
        actionMain.textContent=`BUY $${amt} (Fix RiskTier values)`;
        if(actionReason) actionReason.textContent=`No ticker found for Tier=${tier}. ${sgNote}`;
        if(actionNext) actionNext.textContent=`NEXT UP: ${tier} tier`;
        if(actionMeta) actionMeta.textContent=`Tier: ${tier} | Ticker: —`;
        return;
      }

      actionMain.textContent=`BUY $${amt} ${tkr} (Deposit-Funded)`;
      if(actionReason) actionReason.textContent=`Rotation ${tier}. ${gate.why}. ${sgNote}`;
      if(actionNext) actionNext.textContent=`NEXT UP: ${nextTierFromLast(tier)} tier`;
      if(actionMeta) actionMeta.textContent=`Tier: ${tier} | Ticker: ${tkr}`;

      suggested={tier, ticker:tkr, amount:amt};
    }

    async function loadSystem(){
      if(!systemUrl.value) return;
      const rows=parseCSV(await fetchText(systemUrl.value));
      const map=new Map();
      rows.forEach(r=>map.set((r[0]||"").toUpperCase(), (r[1]||"").trim()));

      if(valRegime) valRegime.textContent=map.get("MARKET REGIME")||"—";
      if(valDeploy) valDeploy.textContent=map.get("DEPLOYMENT SIGNAL")||"—";
      if(valCash)   valCash.textContent=map.get("CASH ANCHOR %")||"—";
      if(valLiq)    valLiq.textContent=map.get("LIQUIDITY")||"—";
      if(valVol)    valVol.textContent=map.get("VOLATILITY")||"—";
      if(valViol)   valViol.textContent=map.get("RULE VIOLATIONS")||map.get("VIOLATIONS")||"—";
    }

    async function loadHoldings(){
      if(!holdingsUrl.value) return;
      const rows=parseCSV(await fetchText(holdingsUrl.value));
      const headers=rows[0];
      const idx=(h)=>headers.indexOf(h);

      if(idx("Ticker")<0){
        holdingsBody.innerHTML=`<tr><td colspan="3">❌ CSV missing "Ticker" column.</td></tr>`;
        holdingsData=[];
        totalValue.textContent="$—";
        return;
      }

      holdingsData=[];
      let total=0;
      const out=[];

      for(let i=1;i<rows.length;i++){
        const r=rows[i];
        const ticker=r[idx("Ticker")];
        if(!ticker) continue;

        const val=idx("Value")>=0 ? (parseFloat(r[idx("Value")])||0) : 0;
        const tier=idx("RiskTier")>=0 ? (r[idx("RiskTier")]||"") : "";

        total+=val;
        holdingsData.push({Ticker:ticker, RiskTier:tier, Value:val});

        out.push(`<tr><td>${ticker}</td><td>${tier}</td><td class="right">${money(val)}</td></tr>`);
      }

      holdingsBody.innerHTML=out.join("") || `<tr><td colspan="3">No rows.</td></tr>`;
      totalValue.textContent=money(total);

      recordTotal(total);
    }

    async function refreshAll(label){
      try{
        await Promise.all([loadSystem(), loadHoldings()]);
        renderMath();
        renderAction();
        stamp(label);
      }catch(e){
        statusLine.textContent="ERROR: "+(e.message||"unknown");
        banner("ERROR: "+(e.message||"unknown"));
      }
    }

    // Buttons (if present)
    if(saveBtn){
      saveBtn.onclick=()=>{
        localStorage.setItem(LS_HOLDINGS, holdingsUrl.value);
        localStorage.setItem(LS_SYSTEM, systemUrl.value);
        refreshAll("Saved + refreshed");
      };
    }
    if(refreshBtn) refreshBtn.onclick=()=>refreshAll("Manual refresh");
    if(runScanBtn) runScanBtn.onclick=()=>refreshAll("Scan complete");

    // Executed (if present)
    if(executedBtn){
      executedBtn.onclick=()=>{
        if(!suggested.ticker || !suggested.tier){
          statusLine.textContent="Nothing to record yet (no valid BUY suggestion).";
          return;
        }
        localStorage.setItem(LS_LAST_EXEC_TICKER, suggested.ticker);
        localStorage.setItem(LS_LAST_EXEC_TIER, suggested.tier);
        localStorage.setItem(LS_LAST_EXEC_TS, String(Date.now()));
        statusLine.textContent=`Recorded executed: ${suggested.ticker} (${suggested.tier}) ✅`;
        renderAction();
      };
    }

    // Initial restore of URLs
    holdingsUrl.value = localStorage.getItem(LS_HOLDINGS) || holdingsUrl.value || "";
    systemUrl.value   = localStorage.getItem(LS_SYSTEM) || systemUrl.value || "";

    // Start
    refreshAll("Loaded");

    // Auto refresh
    let secondsLeft=60;
    setInterval(()=>{
      secondsLeft--;
      if(nextRefresh) nextRefresh.textContent="Next refresh in: "+secondsLeft+"s";
      if(secondsLeft<=0){
        secondsLeft=60;
        statusLine.textContent="Auto-refresh…";
        refreshAll("Auto-refresh complete");
      }
    },1000);

    banner("Nest Mode script running ✅ (SGOV locked).");

  }catch(e){
    // If something truly fatal happens, show it
    try{ document.body.style.background="#0b0b0d"; }catch(_){}
    banner("FATAL SCRIPT ERROR: "+(e.message||String(e)));
  }
})();
</script>
