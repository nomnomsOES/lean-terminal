<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lean Terminal — Minimal Autonomous</title>

<style>
:root{
  --bg:#071121;
  --bg2:#0a1630;
  --line:rgba(255,255,255,.09);
  --soft:rgba(255,255,255,.04);
  --text:#e7eefc;
  --muted:#9bb0cf;
  --green:#22c55e;
  --yellow:#f59e0b;
  --red:#ef4444;
  --blue:#3b82f6;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at top left, rgba(59,130,246,.12), transparent 25%),
    linear-gradient(180deg,var(--bg),var(--bg2));
}

.wrap{max-width:1560px;margin:0 auto;padding:16px}

.top{display:flex;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}

button{
  border:1px solid var(--line);
  background:rgba(255,255,255,.04);
  color:var(--text);
  border-radius:14px;
  padding:8px 12px;
  cursor:pointer;
  font-family:inherit;
}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}

.card{
  background:rgba(255,255,255,.03);
  border:1px solid var(--line);
  border-radius:18px;
}

.head{
  padding:12px;
  border-bottom:1px solid var(--line);
}

.body{padding:12px}

.span12{grid-column:span 12}
.span8{grid-column:span 8}
.span4{grid-column:span 4}

.scroll{
  max-height:280px;
  overflow:auto;
}

/* info button */
.i{
  width:18px;
  height:18px;
  border:1px solid var(--line);
  border-radius:999px;
  display:grid;
  place-items:center;
  font-size:11px;
  color:var(--muted);
  cursor:pointer;
}
.i:hover{
  background:rgba(255,255,255,.08);
  color:#fff;
}

.tbtn{
  background:none;
  border:none;
  color:var(--text);
  font-weight:700;
  cursor:pointer;
  font-family:inherit;
}

table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:8px;
  border-bottom:1px solid var(--line);
  font-size:12px;
}

.good{color:#9df3b2}
.mid{color:#fbd46c}
.bad{color:#ffb3b3}

</style>
</head>

<body>

<div class="wrap">

<div class="grid">

<!-- ACTION (resized) -->
<div class="card span4">
  <div class="head"><b>#3 ACTION</b></div>
  <div class="body">
    <div id="buy"></div>
    <div id="sell"></div>
  </div>
</div>

<!-- HOLDINGS -->
<div class="card span4">
  <div class="head"><b>#8 HOLDINGS</b></div>
  <div class="body">
    <div id="hold" class="scroll"></div>
  </div>
</div>

<!-- RANKING -->
<div class="card span4">
  <div class="head"><b>#9 RANKING</b></div>
  <div class="body scroll">
    <table>
      <tbody id="rank"></tbody>
    </table>
  </div>
</div>

</div>

</div>

<script>

/* ===== SAFE CSV PARSER ===== */
function parseCSV(text){
  const rows=[];
  let row=[],cell="",inQuotes=false;

  for(let i=0;i<text.length;i++){
    const ch=text[i];
    const next=text[i+1];

    if(ch==='"'){
      if(inQuotes && next==='"'){
        cell+='"'; i++;
      } else {
        inQuotes=!inQuotes;
      }
    } else if(ch===',' && !inQuotes){
      row.push(cell); cell="";
    } else if((ch==='\n'||ch==='\r') && !inQuotes){
      if(ch==='\r'&&next==='\n') i++;
      row.push(cell);
      rows.push(row);
      row=[]; cell="";
    } else {
      cell+=ch;
    }
  }

  row.push(cell);
  rows.push(row);

  return rows;
}

/* ===== BASIC DEMO DATA (so page always shows something) ===== */
const demo = [
  {ticker:"NVDA",score:88},
  {ticker:"CRWV",score:82},
  {ticker:"SMH",score:76}
];

/* ===== RENDER ===== */

function render(){
  document.getElementById("rank").innerHTML =
    demo.map((r,i)=>`
      <tr>
        <td>${i+1}</td>
        <td>${r.ticker}</td>
        <td class="${r.score>75?'good':'mid'}">${r.score}</td>
      </tr>
    `).join("");

  document.getElementById("hold").innerHTML =
    demo.map(r=>`<div>${r.ticker}</div>`).join("");

  document.getElementById("buy").innerHTML =
    "<div>Top pick: NVDA</div>";

  document.getElementById("sell").innerHTML =
    "<div>Weak: SMH</div>";
}

/* ===== INFO BUTTONS ===== */
document.querySelectorAll(".i").forEach(el=>{
  if(el.title){
    el.onclick=()=>alert(el.title);
  }
});

render();

</script>

</body>
</html>
