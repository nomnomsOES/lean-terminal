<!DOCTYPE html>
<html>
<head>
  <title>Lean Terminal</title>
  <style>
    body {
      margin: 0;
      background: #0b0b0f;
      color: white;
      font-family: Arial;
    }
    .container {
      padding: 20px;
    }
    .card {
      background: #15151b;
      border: 1px solid #2a2a33;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .title {
      font-size: 28px;
      font-weight: bold;
    }
    .pill-row {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    .pill {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #1a1a22;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <div class="title">🚀 Lean Terminal LIVE</div>
      <div>This confirms everything is working.</div>
    </div>

    <div class="pill-row">
      <div class="pill">READY: 82</div>
      <div class="pill">RISK: 41</div>
      <div class="pill">PLAN: LEAN</div>
    </div>
  </div>
</body>
</html>
