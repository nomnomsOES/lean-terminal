<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lean Terminal Clean Build</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:#e5ecff;
}
.wrap{padding:16px; max-width:1200px; margin:auto;}
h1{margin:0; font-size:20px;}
.sub{color:#9aa7c7; font-size:12px; margin-bottom:10px;}

.grid{display:grid; gap:10px;}
.pills{grid-template-columns:repeat(4,1fr); display:grid; gap:10px;}

.card{
  background:#121c33;
  border-radius:10px;
  padding:12px;
}

.title{font-size:12px; color:#9aa7c7;}
.value{font-size:18px; font-weight:bold;}

.row{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px solid rgba(255,255,255,0.05);
}

.green{color:#22c55e}
.red{color:#ef4444}
.yellow{color:#f59e0b}
.blue{color:#3b82f6}

.section{margin-top:12px;}

.small{font-size:12px;color:#9aa7c7}

</style>
</head>

<body>
<div class="wrap">

<h1>Lean Terminal</h1>
<div class="sub">clean stable build • buy / hold / sell • monte active</div>

<!-- PILLS -->
<div class="pills">

<div class="card">
  <div class="title">READY</div>
  <div class="value green" id="ready">--</div>
</div>

<div class="card">
  <div class="title">RISK</div>
  <div class="value yellow" id="risk">--</div>
</div>

<div class="card">
  <div class="title">PORT</div>
  <div class="value" id="port">--</div>
  <div class="small" id="pl"></div>
</div>

<div class="card">
  <div class="title">VS MARKET</div>
  <div class="value" id="vs">--</div>
</div>

</div>

<!-- TOP 4 -->
<div class="card section">
<h3>Top 4 Horses</h3>
<div id="top4"></div>
</div>

<!-- MOVES -->
<div class="card section">
<h3>Today's Moves</h3>
<div id="moves"></div>
</div>

<!-- POSITIONS -->
<div class="card section">
<h3>What To Do With Positions</h3>
<div id="positions"></div>
</div>

</div>

<script>

// ===== MOCK DATA =====
const DATA = [
  {ticker:"SMH", edge:85, risk:40, monte:68},
  {ticker:"QQQ", edge:75, risk:45, monte:62},
  {ticker:"XLE", edge:70, risk:55, monte:58},
  {ticker:"NVDA", edge:82, risk:60, monte:60},
  {ticker:"SGOV", edge:10, risk:5, monte:50, cash:true}
];

// ===== ENGINE =====
function build(){

  let rows = DATA.map(r => {
    let ecs = Math.round((r.edge*0.5)+(r.monte*0.3)+((100-r.risk)*0.2));
    return {...r, ecs, action:getAction(r, ecs)};
  });

  rows.sort((a,b)=>b.ecs-a.ecs);

  let horses = rows.filter(r=>!r.cash).slice(0,4);

  render(rows, horses);
}

// ===== ACTION LOGIC =====
function getAction(r, ecs){

  if(r.cash) return "HOLD (cash)";

  if(r.monte > 65 && ecs > 75) return "BUY (starter)";
  if(r.monte > 60) return "HOLD";
  if(ecs < 65) return "SELL (trim)";
  return "SELL (exit)";
}

// ===== RENDER =====
function render(rows, horses){

  document.getElementById("ready").innerText = 70;
  document.getElementById("risk").innerText = 45;
  document.getElementById("port").innerText = "$1000";
  document.getElementById("pl").innerText = "P/L: $0 (0%)";
  document.getElementById("vs").innerText = "+0.5%";

  // TOP 4
  document.getElementById("top4").innerHTML =
    horses.map((r,i)=>`
      <div class="row">
        <div>#${i+1} ${r.ticker}</div>
        <div class="green">BUY $${[350,275,225,150][i]}</div>
      </div>
      <div class="small">MONTE: ${r.monte}% green path</div>
    `).join("");

  // MOVES
  document.getElementById("moves").innerHTML =
    rows.map(r=>`
      <div class="row">
        <div>${r.ticker}</div>
        <div>${r.action}</div>
      </div>
    `).join("");

  // POSITIONS
  document.getElementById("positions").innerHTML =
    rows.map(r=>`
      <div class="row">
        <div>${r.ticker}</div>
        <div>${r.action}</div>
      </div>
    `).join("");
}

// INIT
build();

</script>
</body>
</html>
