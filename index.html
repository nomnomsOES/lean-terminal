<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lean Terminal</title>
<style>
body{margin:0;font-family:system-ui;background:#0b0b0d;color:#f3f4f6}
.wrap{max-width:1100px;margin:auto;padding:24px}
.card{margin-top:20px;padding:18px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(255,255,255,.02)}
.pills{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end;margin-top:12px}
.pill{padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.3);font-size:13px}
button{padding:8px 14px;border-radius:8px;background:#1f2937;border:1px solid rgba(255,255,255,.2);color:#fff}
input{width:100%;margin-top:8px;padding:8px;background:#111;border:1px solid #333;color:#fff}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{padding:8px;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px}
th{color:#aaa;text-align:left}
.right{text-align:right}
.small{font-size:12px;color:#aaa;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">

<h1>Lean Terminal</h1>
<div id="statusLine">Ready.</div>
<div id="lastUpdated">LAST UPDATED: —</div>
<div id="nextRefresh">Next refresh in: 60s</div>

<div class="card">
<h2>Good Morning</h2>
<button id="runScanBtn">Run Scan</button>

<div class="pills">
<div class="pill">Regime: <span id="valRegime">—</span></div>
<div class="pill">Cash: <span id="valCash">—</span></div>
<div class="pill">Liquidity: <span id="valLiq">—</span></div>
<div class="pill">Volatility: <span id="valVol">—</span></div>
</div>

<div style="margin-top:16px;padding:16px;border:1px solid rgba(255,255,255,.12);border-radius:12px;">
<div class="small">TODAY ACTION</div>
<div id="actionMain" style="margin-top:6px;font-size:18px;font-weight:700;">—</div>
<div id="actionNext" class="small">NEXT UP: —</div>
</div>
</div>

<div class="card">
<h2>Data Source</h2>
<input id="holdingsUrl" placeholder="Holdings CSV URL (must end with output=csv)">
<input id="systemUrl" placeholder="System CSV URL (must end with output=csv)">
<button id="saveBtn" style="margin-top:10px;">Save</button>
</div>

<div class="card">
<h2>Holdings</h2>
<table>
<thead>
<tr>
<th>Ticker</th>
<th>RiskTier</th>
<th class="right">Value</th>
</tr>
</thead>
<tbody id="holdingsBody">
<tr><td colspan="3">Waiting for data…</td></tr>
</tbody>
</table>
</div>

</div>

<script>

const LS_HOLDINGS="lean_holdings_csv_url";
const LS_SYSTEM="lean_system_csv_url";
const PHASE="DEPLOY";
const RAMP=75;

const statusLine=document.getElementById("statusLine");
const lastUpdated=document.getElementById("lastUpdated");
const nextRefresh=document.getElementById("nextRefresh");

const valRegime=document.getElementById("valRegime");
const valCash=document.getElementById("valCash");
const valLiq=document.getElementById("valLiq");
const valVol=document.getElementById("valVol");

const actionMain=document.getElementById("actionMain");
const actionNext=document.getElementById("actionNext");

const holdingsUrl=document.getElementById("holdingsUrl");
const systemUrl=document.getElementById("systemUrl");
const holdingsBody=document.getElementById("holdingsBody");

function stamp(label){
const t=new Date().toLocaleTimeString();
lastUpdated.textContent="LAST UPDATED: "+t;
statusLine.textContent=label+" @ "+t;
}

async function fetchCSV(url){
if(!url.includes("output=csv") && !url.includes("format=csv")){
throw new Error("URL must end in output=csv");
}
const res=await fetch(url+"&t="+Date.now());
return await res.text();
}

function parseCSV(text){
if(text.trim().startsWith("<")) throw new Error("URL returned HTML not CSV");
return text.trim().split("\n").map(r=>r.split(","));
}

async function loadSystem(){
if(!systemUrl.value) return;
const rows=parseCSV(await fetchCSV(systemUrl.value));
const map=new Map();
rows.forEach(r=>map.set((r[0]||"").toUpperCase(),(r[1]||"").trim()));
valRegime.textContent=map.get("MARKET REGIME")||"—";
valCash.textContent=map.get("CASH ANCHOR %")||"—";
valLiq.textContent=map.get("LIQUIDITY")||"—";
valVol.textContent=map.get("VOLATILITY")||"—";
}

async function loadHoldings(){
if(!holdingsUrl.value) return;
const rows=parseCSV(await fetchCSV(holdingsUrl.value));
const headers=rows[0];
const idx=(h)=>headers.indexOf(h);

let body="";
for(let i=1;i<rows.length;i++){
const r=rows[i];
body+=`<tr>
<td>${r[idx("Ticker")]||""}</td>
<td>${r[idx("RiskTier")]||""}</td>
<td class="right">${r[idx("Value")]||""}</td>
</tr>`;
}
holdingsBody.innerHTML=body||"<tr><td colspan='3'>No rows.</td></tr>";

actionMain.textContent=`SELL $${RAMP} SGOV → BUY $${RAMP} VOO`;
actionNext.textContent="NEXT UP: MED tier";
}

async function refreshAll(label){
try{
await Promise.all([loadSystem(),loadHoldings()]);
stamp(label);
}catch(e){
statusLine.textContent="ERROR: "+e.message;
}
}

document.getElementById("saveBtn").onclick=()=>{
localStorage.setItem(LS_HOLDINGS,holdingsUrl.value);
localStorage.setItem(LS_SYSTEM,systemUrl.value);
refreshAll("Saved");
};

document.getElementById("runScanBtn").onclick=()=>refreshAll("Scan");

holdingsUrl.value=localStorage.getItem(LS_HOLDINGS)||"";
systemUrl.value=localStorage.getItem(LS_SYSTEM)||"";
refreshAll("Loaded");

let s=60;
setInterval(()=>{
s--;
nextRefresh.textContent="Next refresh in: "+s+"s";
if(s<=0){s=60;refreshAll("Auto-refresh");}
},1000);

</script>

</body>
</html>
